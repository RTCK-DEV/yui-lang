<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分岐ツリー ── 結（Yui）× WebLLM</title>
<style>
  :root {
    --bg-1: #2a2330; --bg-2: #1a1a2a;
    --code-bg: #0e1018; --panel: rgba(24,26,34,0.92);
    --text: #f0e8d8; --text-dim: #c0b8a8; --muted: #7a7268;
    --accent: #d97757; --accent-soft: rgba(217,119,87,0.18);
    --keyword: #d97757; --string: #a8c98a; --particle: #6f9bd1;
    --comment: #5d6478; --num: #d8a05f;
    --border: rgba(217,119,87,0.30); --border-soft: rgba(217,119,87,0.12);
    --node-active: #d97757; --node-passed: #b86545; --node-skipped: #5d6478;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text); font-family: "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 20px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-shrink: 0; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0.1em; }
  h1 .mark { color: var(--accent); margin-right: 6px; }
  h1 .sub { color: var(--muted); margin-left: 12px; font-size: 12px; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  button { background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; font-family: inherit; }
  button:hover { background: var(--accent-soft); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: #8a3a3a; border-color: #b04a4a; color: #fff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  main { flex: 1; display: grid; grid-template-columns: 1.4fr 1fr 1fr;
    gap: 1px; background: var(--border-soft); min-height: 0; }
  .pane { background: var(--bg-2); display: flex; flex-direction: column; min-height: 0; }
  .pane-head { padding: 8px 14px; font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.2em;
    border-bottom: 1px solid var(--border-soft);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.18); flex-shrink: 0; }
  .pane-head .ind { color: var(--accent); font-family: "SF Mono", monospace; font-size: 11px; text-transform: none; letter-spacing: 0; }

  /* ── 分岐ツリー ─────────── */
  #tree-pane { background: var(--code-bg); }
  #tree-svg { flex: 1; width: 100%; overflow: hidden; position: relative; cursor: grab; user-select: none; }
  #tree-svg.panning { cursor: grabbing; }
  #tree-svg svg { display: block; width: 100%; height: 100%; }
  #tree-controls { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; z-index: 5; }
  #tree-controls button { background: rgba(0,0,0,0.4); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  #tree-controls button:hover { background: rgba(217,119,87,0.3); }
  .node-rect { stroke-width: 2; transition: all 0.3s; cursor: default; }
  .node-rect.passed { fill: rgba(217,119,87,0.25); stroke: var(--node-active); }
  .node-rect.skipped { fill: rgba(93,100,120,0.15); stroke: var(--node-skipped); stroke-dasharray: 4 4; }
  .node-rect.current { fill: rgba(217,119,87,0.45); stroke: #fff; stroke-width: 3; }
  .node-text { fill: var(--text); font-family: "Hiragino Sans", sans-serif; font-size: 11px; pointer-events: none; }
  .node-text.skipped { fill: var(--muted); font-style: italic; }
  .node-cond { fill: var(--particle); font-size: 10px; font-family: "SF Mono", monospace; }
  .edge { stroke-width: 2; fill: none; }
  .edge.passed { stroke: var(--node-active); }
  .edge.skipped { stroke: var(--node-skipped); stroke-dasharray: 3 3; opacity: 0.5; }

  /* ── 物語 ──────────── */
  #story-pane { background: linear-gradient(135deg, rgba(42,35,48,0.6), rgba(20,20,32,0.6));
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; }
  #story { flex: 1; overflow-y: auto; padding: 24px 28px; font-size: 14px; line-height: 1.9; }
  #story .turn-marker { color: var(--accent); font-size: 11px; letter-spacing: 0.2em;
    border-bottom: 1px dotted var(--border-soft); padding: 0.4em 0; margin: 1em 0 0.6em; }
  #story .narration { color: var(--text); margin: 0 0 0.5em; opacity: 0; animation: fadeIn 0.4s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  #story .speech { padding-left: 1em; margin: 0 0 0.5em; opacity: 0; animation: fadeIn 0.4s forwards; }
  #story .speech .name { color: var(--accent); font-weight: 500; }
  #story .thought { color: var(--text-dim); font-style: italic; padding-left: 1em; margin: 0 0 0.5em; opacity: 0; animation: fadeIn 0.4s forwards; }
  #story .meta { color: var(--muted); font-size: 11px; padding-left: 1em; font-family: "SF Mono", monospace; opacity: 0; animation: fadeIn 0.4s forwards; }

  /* ── Yuiコード ──────────── */
  #yui-pane { background: var(--code-bg); }
  #yui-out { flex: 1; overflow-y: auto; padding: 12px 16px;
    font-family: "SF Mono","Menlo",monospace; font-size: 11.5px; line-height: 1.7;
    white-space: pre-wrap; word-wrap: break-word; }
  #yui-out .turn { padding: 6px 0; border-bottom: 1px dashed var(--border-soft); margin-bottom: 6px; }
  #yui-out .turn-head { color: var(--muted); font-size: 10px; margin-bottom: 4px; }
  .tok-kw { color: var(--keyword); font-weight: 500; }
  .tok-str { color: var(--string); }
  .tok-particle { color: var(--particle); }
  .tok-comment { color: var(--comment); font-style: italic; }
  .tok-num { color: var(--num); }

  /* ── 状態バー ──── */
  #status-bar { padding: 8px 16px; background: rgba(0,0,0,0.3);
    border-top: 1px solid var(--border-soft); font-size: 11px; color: var(--text-dim);
    display: flex; gap: 14px; flex-wrap: wrap; flex-shrink: 0; }
  #status-bar .st { display: flex; gap: 5px; align-items: center; }
  #status-bar .st .l { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
  #status-bar .st .v { color: var(--accent); font-family: "SF Mono", monospace; }

  footer { padding: 5px 18px; color: var(--muted); font-size: 10px; text-align: right;
    background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-soft); flex-shrink: 0; }

  /* ── ローダー ──── */
  .loader-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center; z-index: 100; }
  .loader { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
    max-width: 540px; width: 90%; padding: 28px 32px; }
  .loader h2 { margin: 0 0 12px; color: var(--accent); font-size: 17px; letter-spacing: 0.1em; }
  .loader p { color: var(--text-dim); font-size: 13px; line-height: 1.85; margin: 0 0 10px; }
  .loader select { width: 100%; background: var(--code-bg); color: var(--text); border: 1px solid var(--border);
    padding: 10px 12px; border-radius: 4px; font: inherit; font-size: 13px; margin: 8px 0 14px; }
  .loader .progress { margin: 14px 0; height: 5px; background: var(--code-bg); border-radius: 3px; overflow: hidden; }
  .loader .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  .loader .pre-msg { font-size: 11px; color: var(--muted); font-family: "SF Mono", monospace;
    margin-top: 12px; max-height: 70px; overflow-y: auto; padding: 6px 8px;
    background: var(--code-bg); border-radius: 3px; }
  .loader-actions { margin-top: 14px; display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1><span class="mark">結</span>分岐ツリー<span class="sub">LLMが分岐コードを書き、Yuiで評価して物語が枝分かれする</span></h1>
  <div class="toolbar">
    <button id="resetBtn">リセット</button>
    <button id="stopBtn" class="danger" disabled>■ 停止</button>
    <button id="startBtn" class="primary" disabled>▶ 開始</button>
  </div>
</header>
<main>
  <div class="pane" id="tree-pane">
    <div class="pane-head"><span>BRANCH TREE</span><span class="ind" id="tree-ind">ノード数 0</span></div>
    <div id="tree-svg">
      <div id="tree-controls">
        <button id="treeFitBtn" title="全体表示">⛶ 全体</button>
        <button id="treeFollowBtn" title="現在ノードを追従" class="active">⊙ 追従</button>
        <button id="treeZoomInBtn" title="拡大">＋</button>
        <button id="treeZoomOutBtn" title="縮小">−</button>
      </div>
    </div>
  </div>
  <div class="pane" id="story-pane">
    <div class="pane-head"><span>STORY</span><span class="ind" id="story-ind">準備中</span></div>
    <div id="story"></div>
    <div id="status-bar">
      <div class="st"><span class="l">場面</span><span class="v" id="s-scene">教室の朝</span></div>
      <div class="st"><span class="l">葵</span><span class="v" id="s-aoi">30</span></div>
      <div class="st"><span class="l">気分</span><span class="v" id="s-mood">中立</span></div>
      <div class="st"><span class="l">ターン</span><span class="v" id="s-turn">0</span></div>
    </div>
  </div>
  <div class="pane" id="yui-pane">
    <div class="pane-head"><span>YUI（生成された分岐コード）</span><span class="ind" id="yui-ind">行 0</span></div>
    <div id="yui-out"></div>
  </div>
</main>
<footer>結（Yui）v1.0 ／ 分岐ツリー駆動 ／ © RTCK</footer>

<div id="loader" class="loader-overlay">
  <div class="loader">
    <h2>WebLLM 起動 ── モデル選択</h2>
    <p>分岐コード生成には Hermes 3 か Qwen 2.5 推奨。</p>
    <select id="model-select">
      <option value="Hermes-3-Llama-3.2-3B-q4f16_1-MLC" selected>Hermes 3 Llama 3.2 3B（推奨）</option>
      <option value="Qwen2.5-3B-Instruct-q4f16_1-MLC">Qwen 2.5 3B Instruct</option>
      <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama 3.2 3B Instruct</option>
    </select>
    <div class="progress" id="progress-wrap" style="display:none"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="pre-msg" id="loader-msg" style="display:none">準備中…</div>
    <div class="loader-actions">
      <button id="loader-skip">スキップ（オフラインデモ）</button>
      <button class="primary" id="loader-start">▶ ロード開始</button>
    </div>
  </div>
</div>

<script type="module">/* ── YUI:BEGIN ── tools/build_html.py が yui.js / stdlib.yui / builtin_types.json から生成する。直接編集しないこと ── */
/* ============================================================
 * 結（Yui）言語 — ブラウザ実装（インタプリタ本体）
 *
 * このファイルが JavaScript 実装の唯一の原本。
 * repl.html / drama_player.html / ai_player.html / ai_dialog.html /
 * ai_branch.html の5つは、tools/build_html.py がこの内容と stdlib.yui を
 * 各 HTML へ埋め込んで生成する。HTML 側の埋め込みブロックを直接編集しても
 * 次のビルドで上書きされる。編集はここに対して行うこと。
 *
 * 各 HTML はこのコアの「後ろ」に自分の UI と固有の組み込み関数を足す。
 * 例：drama_player.html は 表示 / 入力 を差し替え、劇用の関数を追加する。
 *
 * Python リファレンス実装は ../yui.py。両者の挙動差は
 * tools/diff_impls.py で測れる。
 *
 * 著作権表記：RTCK
 * ============================================================ */

"use strict";
/* ============================================================
 * 結（Yui）言語 — JavaScript実装（Python版と同等）
 * ============================================================ */

// ── 文字正規化 ──────────────────────────────────────────────
const ZEN2HAN = {
  "０":"0","１":"1","２":"2","３":"3","４":"4",
  "５":"5","６":"6","７":"7","８":"8","９":"9",
  "＋":"+","－":"-","×":"*","÷":"/","％":"%",
  "＝":"=","＜":"<","＞":">",
  "（":"(","）":")","［":"[","］":"]","｛":"{","｝":"}",
  "：":":","　":" ",
};
const KAN_DIGIT = {"零":0,"〇":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
const KAN_UNIT  = {"十":10,"百":100,"千":1000,"万":10000,"億":100000000};

function normChar(c) { return ZEN2HAN[c] || c; }

function kan2int(s) {
  if (!s) return null;
  for (const c of s) if (!(c in KAN_DIGIT) && !(c in KAN_UNIT)) return null;
  let total = 0, section = 0, current = 0;
  for (const c of s) {
    if (c in KAN_DIGIT) {
      current = KAN_DIGIT[c];
    } else {
      const unit = KAN_UNIT[c];
      if (unit >= 10000) {
        let base = section + current;
        if (base === 0) base = 1;
        section = base * unit;
        total += section;
        section = 0;
      } else {
        section += (current || 1) * unit;
      }
      current = 0;
    }
  }
  return total + section + current;
}

// ── 字句解析 ────────────────────────────────────────────────
const PARTICLES = ["から","まで","より","について","を","に","で","へ","と","は","が","の"];
const KEYWORDS  = [
  "もし","ならば","そうでなければ","おわり",
  "繰り返す","のあいだ","各",
  "関数","戻り値","戻る",
  "真","偽","無",
  "かつ","または","でない",
  "とする","である","せよ","だろうか",
  "以上","以下","未満",
  "等しい","等しくない","大きい","小さい",
  "やめる","次へ",
  "種族","属性","新しい",
  "試す","ならば失敗",
];
const KW_OR_PARTICLE_SORTED = [...new Set([...KEYWORDS, ...PARTICLES])].sort((a,b)=>b.length-a.length);

const RE_IDENT_START = /[ぁ-んァ-ヶー一-龥a-zA-Z_々〆ヵヶ]/;
const RE_IDENT_CHAR  = /[ぁ-んァ-ヶー一-龥a-zA-Z_0-9々〆ヵヶ]/;

function matchKwOrParticle(src, i) {
  for (const w of KW_OR_PARTICLE_SORTED) {
    if (src.startsWith(w, i)) return w;
  }
  return null;
}

/**
 * 助詞を含む組み込み関数名の一覧を長い順で返す。yui.py の
 * _composite_builtin_names と対。
 *
 * 「文字列にする」のような名前は助詞「に」の位置で識別子が切れてしまい、
 * そのままでは呼び出せない（「文字列」「に」「する」の3トークンになる）。
 * 字句解析の時点で1つの識別子として切り出すことで、通常の呼び出し・
 * 「の」後置記法・高階関数への文字列渡しのすべてで到達できるようにする。
 *
 * 一覧は BUILTINS から導出するので、助詞入りの組み込みが増えても追随する。
 */
let _compositeBuiltins = null;
function compositeBuiltinNames() {
  if (_compositeBuiltins === null) {
    _compositeBuiltins = Object.keys(BUILTINS)
      .filter(name => {
        for (let k = 1; k < name.length; k++) if (matchKwOrParticle(name, k)) return true;
        return false;
      })
      .sort((a, b) => b.length - a.length);
  }
  return _compositeBuiltins;
}

class LexError extends Error {}
class ParseError extends Error {}
class RuntimeYuiError extends Error {}

function tokenize(src) {
  const tokens = [];
  let i = 0, line = 1;
  const n = src.length;
  const emit = (kind, value) => tokens.push({kind, value, line});

  while (i < n) {
    const c = src[i];

    if (c === "\n") {
      if (tokens.length && tokens[tokens.length-1].kind !== "NEWLINE") emit("NEWLINE","\n");
      line++; i++; continue;
    }
    if (" \t\r　、，".includes(c)) { i++; continue; }

    if (c === "※") {
      while (i < n && src[i] !== "\n") i++;
      continue;
    }
    if (c === "〔") {
      let depth = 1; i++;
      while (i < n && depth > 0) {
        if (src[i]==="〔") depth++;
        else if (src[i]==="〕") depth--;
        else if (src[i]==="\n") line++;
        i++;
      }
      continue;
    }

    if (c === "「" || c === "『") {
      const close = c === "「" ? "」" : "』";
      const isRaw = c === "「";
      i++;
      let buf = "";
      while (i < n && src[i] !== close) {
        if (!isRaw && src[i] === "\\" && i+1 < n) {
          const nx = src[i+1];
          buf += {"n":"\n","t":"\t","r":"\r","\\":"\\","「":"「","」":"」","『":"『","』":"』","{":"","}":""}[nx] || nx;
          i += 2;
        } else {
          if (src[i] === "\n") line++;
          buf += src[i]; i++;
        }
      }
      if (i >= n) throw new LexError(`${line}行目：文字列リテラルが閉じていません`);
      i++;
      emit(isRaw ? "STR_RAW" : "STR_COOKED", buf);
      continue;
    }

    const nc = normChar(c);
    if (/[0-9]/.test(nc)) {
      let j = i, buf = "";
      while (j < n) {
        const cn = normChar(src[j]);
        if (cn === "_") { j++; continue; }       // 桁区切り
        if (/[0-9]/.test(cn) || cn === ".") { buf += cn; j++; }
        else break;
      }
      const val = buf.includes(".") ? parseFloat(buf) : parseInt(buf, 10);
      emit("NUM", val);
      i = j; continue;
    }

    if (c in KAN_DIGIT || c in KAN_UNIT) {
      let j = i;
      while (j < n && (src[j] in KAN_DIGIT || src[j] in KAN_UNIT)) j++;
      const ok = (j === n) || !RE_IDENT_CHAR.test(src[j]) || matchKwOrParticle(src, j);
      if (ok) {
        const v = kan2int(src.slice(i, j));
        if (v !== null) {
          emit("NUM", v); i = j; continue;
        }
      }
    }

    // 多文字記号
    let matchedSym = null;
    for (const sym of ["==","!=","<=",">=","≠","≦","≧"]) {
      if (src.startsWith(sym, i)) {
        matchedSym = ({"≠":"!=","≦":"<=","≧":">="})[sym] || sym;
        i += sym.length; break;
      }
    }
    if (matchedSym) { emit("SYM", matchedSym); continue; }

    if (c === "→") { emit("SYM", "→"); i++; continue; }

    if ("+-*/%=()[]{}:,.<>".includes(nc)) {
      emit("SYM", nc); i++; continue;
    }

    // 助詞を含む組み込み関数名（「文字列にする」など）は分割せず1識別子にする。
    // 直後が識別子文字なら別の名前なので対象外（「整数にする2」など）。
    let composite = null;
    for (const cname of compositeBuiltinNames()) {
      if (src.startsWith(cname, i)) {
        const j = i + cname.length;
        if (j >= n || !RE_IDENT_CHAR.test(src[j])) { composite = cname; break; }
      }
    }
    if (composite) { emit("IDENT", composite); i += composite.length; continue; }

    const kp = matchKwOrParticle(src, i);
    if (kp) {
      emit(kp.length >= 0 && KEYWORDS.includes(kp) ? "KW" : "PARTICLE", kp);
      i += kp.length; continue;
    }

    if (RE_IDENT_START.test(c)) {
      let j = i + 1;
      while (j < n) {
        if (!RE_IDENT_CHAR.test(src[j])) break;
        if (matchKwOrParticle(src, j)) break;
        j++;
      }
      emit("IDENT", src.slice(i, j));
      i = j; continue;
    }

    throw new LexError(`${line}行目：解釈できない文字「${c}」(U+${c.codePointAt(0).toString(16).toUpperCase()})`);
  }
  if (tokens.length && tokens[tokens.length-1].kind !== "NEWLINE") emit("NEWLINE","\n");
  emit("EOF", null);
  return tokens;
}

// ── AST ─────────────────────────────────────────────────────
const N = {
  Num:   (v)             => ({type:"Num", value:v}),
  Str:   (v,cooked)      => ({type:"Str", value:v, isCooked: !!cooked}),
  Bool:  (v)             => ({type:"Bool", value:v}),
  None:  ()              => ({type:"None"}),
  Ident: (n)             => ({type:"Ident", name:n}),
  List:  (items)         => ({type:"List", items}),
  Dict:  (pairs)         => ({type:"Dict", pairs}),
  Bin:   (op,l,r)        => ({type:"Bin", op, left:l, right:r}),
  Un:    (op,o)          => ({type:"Un", op, operand:o}),
  Call:  (verb,args,cmd) => ({type:"Call", verb, args, isCmd: cmd||false}),
  Assign:(name,val,c)    => ({type:"Assign", name, value:val, isConst:c}),
  If:    (c,t,e)         => ({type:"If", cond:c, then:t, else:e}),
  While: (c,b)           => ({type:"While", cond:c, body:b}),
  ForR:  (v,s,e,b)       => ({type:"ForR", var:v, start:s, end:e, body:b}),
  ForE:  (v,it,b)        => ({type:"ForE", var:v, iter:it, body:b}),
  Func:  (verb,p,b)      => ({type:"Func", verb, params:p, body:b}),
  Ret:   (v)             => ({type:"Ret", value:v}),
  Topic: (t,b)           => ({type:"Topic", topic:t, body:b}),
  Expr:  (e)             => ({type:"Expr", expr:e}),
  Prog:  (b)             => ({type:"Prog", body:b}),
  Brk:   ()              => ({type:"Brk"}),
  Cont:  ()              => ({type:"Cont"}),
  RaceDef:(name,attrs)   => ({type:"RaceDef", name, attrs}),
  New:   (race,fields)   => ({type:"New", race, fields}),
  Try:   (tb, cb)        => ({type:"Try", tryBody:tb, catchBody:cb}),
  Lambda:(params, body)  => ({type:"Lambda", params, body}),
};

// ── Parser ──────────────────────────────────────────────────
class Parser {
  constructor(tokens) { this.tokens = tokens; this.pos = 0; }
  peek(o=0) { return this.tokens[this.pos+o]; }
  advance() { return this.tokens[this.pos++]; }
  check(kind, value) {
    const t = this.peek();
    if (t.kind !== kind) return false;
    if (value !== undefined && t.value !== value) return false;
    return true;
  }
  match(kind, value) { return this.check(kind, value) ? this.advance() : null; }
  expect(kind, value) {
    const t = this.peek();
    if (!this.check(kind, value)) throw new ParseError(`${t.line}行目：期待 ${kind}(${value}) 実際 ${t.kind}(${JSON.stringify(t.value)})`);
    return this.advance();
  }
  skipNewlines() { while (this.check("NEWLINE")) this.advance(); }

  parseProgram() {
    const body = [];
    this.skipNewlines();
    while (!this.check("EOF")) {
      const s = this.parseStatement();
      if (s) body.push(s);
      this.skipNewlines();
    }
    return N.Prog(body);
  }

  parseStatement() {
    if (this.check("KW","もし")) return this.parseIf();
    if (this.check("KW","各")) return this.parseFor();
    if (this.check("KW","関数") && this.peek(1).kind === "SYM" && this.peek(1).value === ":") return this.parseFuncDef();
    if (this.check("KW","戻り値")) return this.parseReturnValue();
    if (this.check("KW","戻る")) { this.advance(); return N.Ret(null); }
    if (this.check("KW","やめる")) { this.advance(); return N.Brk(); }
    if (this.check("KW","次へ"))   { this.advance(); return N.Cont(); }
    if (this.check("KW","種族"))   return this.parseRaceDef();
    if (this.check("KW","試す"))   return this.parseTry();
    const line = this.collectLine();
    return this.parseLine(line);
  }

  collectLine() {
    const toks = [];
    let depth = 0;
    while (!this.check("EOF")) {
      const t = this.peek();
      if (t.kind === "NEWLINE" && depth === 0) { this.advance(); break; }
      if (t.kind === "SYM" && "([{".includes(t.value)) depth++;
      else if (t.kind === "SYM" && ")]}".includes(t.value)) depth--;
      toks.push(this.advance());
    }
    return toks;
  }

  parseLine(toks) {
    if (!toks.length) return null;

    if (toks.length >= 2 && toks[toks.length-1].value === "繰り返す" && toks[toks.length-2].value === "のあいだ") {
      const cond = this.parseExprFrom(toks.slice(0, -2));
      const body = this.parseBlockUntil(["おわり"]);
      return N.While(cond, body);
    }

    const last = toks[toks.length-1];
    if (last.kind === "PARTICLE" && last.value === "について") {
      const topic = this.parseExprFrom(toks.slice(0, -1));
      const body = this.parseBlockUntil(["おわり"]);
      return N.Topic(topic, body);
    }
    if (last.kind === "KW" && last.value === "とする") return this.parseAssign(toks.slice(0,-1), false);
    if (last.kind === "KW" && last.value === "である") return this.parseAssign(toks.slice(0,-1), true);
    if (last.kind === "KW" && last.value === "せよ") {
      const expr = this.parseCallFrom(toks.slice(0,-1), true);
      return N.Expr(expr);
    }
    if (last.kind === "KW" && last.value === "だろうか") {
      return N.Expr(this.parseExprFrom(toks.slice(0,-1)));
    }
    return N.Expr(this.parseExprFrom(toks));
  }

  parseAssign(toks, isConst) {
    if (!toks.length || toks[0].kind !== "IDENT") throw new ParseError("代入文の左辺は識別子");
    const name = toks[0].value;
    if (toks.length < 3 || toks[1].kind !== "PARTICLE" || !["を","は"].includes(toks[1].value))
      throw new ParseError(`${toks[0].line}行目：代入は「<名前>を/は <式>」の形`);
    const rhs = this.parseExprFrom(toks.slice(2));
    return N.Assign(name, rhs, isConst);
  }

  parseIf() {
    this.expect("KW","もし");
    const condToks = [];
    while (!this.check("KW","ならば")) {
      if (this.check("EOF") || this.check("NEWLINE")) throw new ParseError("もし文に「ならば」がありません");
      condToks.push(this.advance());
    }
    this.expect("KW","ならば");
    this.skipNewlines();
    const then = [];
    while (!this.check("KW","そうでなければ") && !this.check("KW","おわり")) {
      if (this.check("EOF")) throw new ParseError("もし文に「おわり」がありません");
      const s = this.parseStatement();
      if (s) then.push(s);
      this.skipNewlines();
    }
    let elseBody = [];
    if (this.match("KW","そうでなければ")) {
      if (this.check("KW","もし")) {
        elseBody = [this.parseIf()];
        return N.If(this.parseExprFrom(condToks), then, elseBody);
      }
      this.skipNewlines();
      while (!this.check("KW","おわり")) {
        if (this.check("EOF")) throw new ParseError("もし文に「おわり」がありません");
        const s = this.parseStatement();
        if (s) elseBody.push(s);
        this.skipNewlines();
      }
    }
    this.expect("KW","おわり");
    return N.If(this.parseExprFrom(condToks), then, elseBody);
  }

  parseFor() {
    this.expect("KW","各");
    const varTok = this.expect("IDENT");
    this.expect("PARTICLE","を");
    const bodyToks = [];
    while (!this.check("KW","繰り返す")) {
      if (this.check("EOF") || this.check("NEWLINE")) throw new ParseError("各文に「繰り返す」がありません");
      bodyToks.push(this.advance());
    }
    this.expect("KW","繰り返す");
    if (bodyToks.length && bodyToks[bodyToks.length-1].kind === "PARTICLE" && bodyToks[bodyToks.length-1].value === "について") {
      const it = this.parseExprFrom(bodyToks.slice(0,-1));
      const block = this.parseBlockUntil(["おわり"]);
      return N.ForE(varTok.value, it, block);
    }
    let kara = -1, made = -1;
    bodyToks.forEach((t,i) => {
      if (t.kind === "PARTICLE" && t.value === "から") kara = i;
      if (t.kind === "PARTICLE" && t.value === "まで") made = i;
    });
    if (kara === -1 || made === -1 || made <= kara) throw new ParseError("各文は「<開始>から<終了>まで」または「<配列>について」");
    const start = this.parseExprFrom(bodyToks.slice(0, kara));
    const end   = this.parseExprFrom(bodyToks.slice(kara+1, made));
    const block = this.parseBlockUntil(["おわり"]);
    return N.ForR(varTok.value, start, end, block);
  }

  parseFuncDef() {
    this.expect("KW","関数");
    this.expect("SYM",":");
    const sig = [];
    while (!this.check("NEWLINE") && !this.check("EOF")) sig.push(this.advance());
    this.expect("NEWLINE");
    const params = [];
    const verbParts = [];
    let i = 0;
    while (i < sig.length) {
      const t = sig[i];
      if (t.kind === "SYM" && t.value === "[") {
        if (i+2 >= sig.length) throw new ParseError("関数シグネチャ：[]助詞が壊れています");
        const nameTok = sig[i+1];
        if (sig[i+2].kind !== "SYM" || sig[i+2].value !== "]") throw new ParseError("関数シグネチャ：]がありません");
        const pTok = sig[i+3];
        if (!pTok || pTok.kind !== "PARTICLE") throw new ParseError("関数シグネチャ：仮引数の後に助詞が必要");
        params.push([nameTok.value, pTok.value]);
        i += 4;
      } else {
        if (t.kind === "IDENT" || t.kind === "KW") verbParts.push(t.value);
        i++;
      }
    }
    const verb = verbParts.join("");
    const body = this.parseBlockUntil(["おわり"]);
    return N.Func(verb, params, body);
  }

  parseReturnValue() {
    this.expect("KW","戻り値");
    this.expect("SYM",":");
    const toks = this.collectLine();
    return N.Ret(this.parseExprFrom(toks));
  }

  parseTry() {
    this.expect("KW","試す");
    this.skipNewlines();
    const tryBody = [];
    while (!this.check("KW","ならば失敗")) {
      if (this.check("EOF")) throw new ParseError("試す文に「ならば失敗」がありません");
      const s = this.parseStatement();
      if (s) tryBody.push(s);
      this.skipNewlines();
    }
    this.expect("KW","ならば失敗");
    this.skipNewlines();
    const catchBody = [];
    while (!this.check("KW","おわり")) {
      if (this.check("EOF")) throw new ParseError("試す文に「おわり」がありません");
      const s = this.parseStatement();
      if (s) catchBody.push(s);
      this.skipNewlines();
    }
    this.advance();
    return N.Try(tryBody, catchBody);
  }

  parseLambda() {
    this.expect("KW","関数");
    this.expect("SYM","(");
    const params = [];
    while (!this.check("SYM",")")) {
      this.expect("SYM","[");
      const name = this.expect("IDENT").value;
      this.expect("SYM","]");
      const pt = this.peek();
      if (pt.kind !== "PARTICLE") throw new ParseError(`${pt.line}行目：ラムダ仮引数の後に助詞が必要`);
      this.advance();
      params.push([name, pt.value]);
    }
    this.expect("SYM",")");
    const body = this.parseExpr();
    return N.Lambda(params, body);
  }

  parseRaceDef() {
    this.expect("KW","種族");
    const name = this.expect("IDENT").value;
    this.expect("SYM",":");
    this.skipNewlines();
    const attrs = [];
    while (!this.check("KW","おわり")) {
      if (this.check("EOF")) throw new ParseError("種族定義に「おわり」がありません");
      if (this.check("KW","属性")) {
        this.advance();
        this.expect("SYM",":");
        attrs.push(this.expect("IDENT").value);
        while (this.match("SYM",",")) attrs.push(this.expect("IDENT").value);
        this.skipNewlines();
      } else {
        throw new ParseError(`${this.peek().line}行目：種族定義中に「属性：」が必要`);
      }
    }
    this.advance();
    return N.RaceDef(name, attrs);
  }
  parseNewInstance() {
    this.expect("KW","新しい");
    const race = this.expect("IDENT").value;
    this.expect("SYM","(");
    this.skipNewlines();
    const fields = {};
    if (!this.check("SYM",")")) {
      while (true) {
        this.skipNewlines();
        const k = this.expect("IDENT").value;
        this.expect("SYM","→");
        fields[k] = this.parseExpr();
        this.skipNewlines();
        if (!this.match("SYM",",")) break;
        this.skipNewlines();
      }
    }
    this.skipNewlines();
    this.expect("SYM",")");
    return N.New(race, fields);
  }

  parseBlockUntil(terminators) {
    const body = [];
    this.skipNewlines();
    while (!terminators.some(t => this.check("KW", t))) {
      if (this.check("EOF")) throw new ParseError(`ブロックの終端 ${terminators} が見つかりません`);
      const s = this.parseStatement();
      if (s) body.push(s);
      this.skipNewlines();
    }
    this.advance();
    return body;
  }

  parseExprFrom(toks) {
    // yui.py の _parse_expr_from と同じ順序：まず式として解析し、
    // トークンが余った場合にかぎり「項助詞…動詞」の呼び出しとして解釈し直す。
    // 呼び出しを先に試すと「i が B 以下」の tail が [B, 以下] になり、
    // 単独比較語ガードをすり抜けて関数「B以下」の呼び出しになってしまう。
    const pad = () => [{kind:"NEWLINE",value:"\n",line:0}, {kind:"EOF",value:null,line:0}];
    const sub = new Parser([...toks, ...pad()]);
    const node = sub.parseExpr();
    if (!(sub.check("NEWLINE") || sub.check("EOF"))) {
      const sub2 = new Parser([...toks, ...pad()]);
      return sub2.parseCallOrExpr();
    }
    return node;
  }

  parseCallFrom(toks, isCmd) {
    const sub = new Parser([...toks, {kind:"NEWLINE",value:"\n",line:0}, {kind:"EOF",value:null,line:0}]);
    const node = sub.parseCallOrExpr();
    if (node.type === "Call") node.isCmd = isCmd;
    return node;
  }

  parseCallOrExpr() {
    const saved = this.pos;
    const pieces = this.scanPieces();
    if (!pieces) {
      this.pos = saved;
      return this.parseExpr();
    }
    const [seg, particles, tail] = pieces;
    const args = {};
    seg.forEach((s, idx) => {
      args[particles[idx]] = this.parseExprFrom(s);
    });
    const verb = tail.map(t=>t.value).join("");
    return N.Call(verb, args, false);
  }

  scanPieces() {
    let seg = [[]];
    const particles = [];
    let depth = 0;
    const toks = [];
    while (!this.check("NEWLINE") && !this.check("EOF")) toks.push(this.advance());
    for (const t of toks) {
      if (t.kind === "SYM" && "([{".includes(t.value)) { depth++; seg[seg.length-1].push(t); continue; }
      if (t.kind === "SYM" && ")]}".includes(t.value)) { depth--; seg[seg.length-1].push(t); continue; }
      // 「の」「は」は scan_pieces では区切らない（前者はpostfix、後者は代入と衝突）
      if (depth === 0 && t.kind === "PARTICLE" && ["を","に","で","へ","と","から","まで","より","が"].includes(t.value)) {
        particles.push(t.value);
        seg.push([]);
        continue;
      }
      seg[seg.length-1].push(t);
    }
    if (!particles.length) return null;
    const tail = seg[seg.length-1];
    seg = seg.slice(0, -1);
    if (seg.length !== particles.length) return null;
    if (!tail.length || tail.some(t => t.kind !== "IDENT" && t.kind !== "KW")) return null;
    // 末尾が比較語なら呼び出しではなく式扱い
    if (tail.length === 1 && tail[0].kind === "KW" &&
        ["大きい","小さい","以上","以下","未満","等しい","等しくない"].includes(tail[0].value)) return null;
    return [seg, particles, tail];
  }

  parseExpr() { return this.parseOr(); }
  parseOr() {
    let l = this.parseAnd();
    while (this.check("KW","または")) { this.advance(); l = N.Bin("or", l, this.parseAnd()); }
    return l;
  }
  parseAnd() {
    let l = this.parseNot();
    while (this.check("KW","かつ")) { this.advance(); l = N.Bin("and", l, this.parseNot()); }
    return l;
  }
  parseNot() {
    if (this.match("KW","でない")) return N.Un("not", this.parseNot());
    return this.parseCompare();
  }
  parseCompare() {
    const left = this.parseAdd();

    // 「が」マーカー：比較式として試行、失敗したら巻き戻して呼び出しに譲る
    if (this.peek().kind === "PARTICLE" && this.peek().value === "が") {
      const save = this.pos;
      try {
        this.advance();
        const right = this.parseAdd();
        if (this.match("PARTICLE","より")) {
          if (this.match("KW","大きい")) return N.Bin(">",  left, right);
          if (this.match("KW","小さい")) return N.Bin("<",  left, right);
          if (this.match("KW","以上"))   return N.Bin(">=", left, right);
          if (this.match("KW","以下"))   return N.Bin("<=", left, right);
          if (this.match("KW","未満"))   return N.Bin("<",  left, right);
          throw new ParseError("「より」の後に比較語が必要");
        }
        if (this.match("PARTICLE","と")) {
          if (this.match("KW","等しい"))     return N.Bin("==", left, right);
          if (this.match("KW","等しくない")) return N.Bin("!=", left, right);
          throw new ParseError("「と」の後に比較語が必要");
        }
        if (this.match("KW","以上")) return N.Bin(">=", left, right);
        if (this.match("KW","以下")) return N.Bin("<=", left, right);
        if (this.match("KW","未満")) return N.Bin("<",  left, right);
        const t2 = this.peek();
        if (t2.kind === "SYM" && ["==","!=","<",">","<=",">="].includes(t2.value)) {
          const op = this.advance().value;
          return N.Bin(op, right, this.parseAdd());
        }
        throw new ParseError("「が」の後に比較形式が必要");
      } catch (e) {
        if (e instanceof ParseError) { this.pos = save; }
        else throw e;
      }
    }

    const t = this.peek();
    if (t.kind === "SYM" && ["==","!=","<",">","<=",">="].includes(t.value)) {
      const op = this.advance().value;
      return N.Bin(op, left, this.parseAdd());
    }
    if (t.kind === "PARTICLE" && t.value === "より") {
      const save = this.pos;
      this.advance();
      const right = this.parseAdd();
      if (this.match("KW","大きい")) return N.Bin(">",  left, right);
      if (this.match("KW","小さい")) return N.Bin("<",  left, right);
      if (this.match("KW","以上"))   return N.Bin(">=", left, right);
      if (this.match("KW","以下"))   return N.Bin("<=", left, right);
      if (this.match("KW","未満"))   return N.Bin("<",  left, right);
      this.pos = save;
    }
    if (t.kind === "PARTICLE" && t.value === "と") {
      const save = this.pos;
      this.advance();
      const right = this.parseAdd();
      if (this.match("KW","等しい"))     return N.Bin("==", left, right);
      if (this.match("KW","等しくない")) return N.Bin("!=", left, right);
      this.pos = save;
    }
    return left;
  }
  parseAdd() {
    let l = this.parseMul();
    while (this.peek().kind === "SYM" && ["+","-"].includes(this.peek().value)) {
      const op = this.advance().value;
      l = N.Bin(op, l, this.parseMul());
    }
    return l;
  }
  parseMul() {
    let l = this.parseUnary();
    while (this.peek().kind === "SYM" && ["*","/","%"].includes(this.peek().value)) {
      const op = this.advance().value;
      l = N.Bin(op, l, this.parseUnary());
    }
    return l;
  }
  parseUnary() {
    if (this.peek().kind === "SYM" && this.peek().value === "-") {
      this.advance();
      return N.Un("neg", this.parseUnary());
    }
    return this.parsePostfix();
  }
  parsePostfix() {
    let node = this.parseAtom();
    while (true) {
      if (this.peek().kind === "PARTICLE" && this.peek().value === "の" && this.peek(1).kind === "IDENT") {
        this.advance();
        const v = this.advance();
        node = N.Call(v.value, {"の": node}, false);
        continue;
      }
      if (this.peek().kind === "KW" && this.peek().value === "でない") {
        this.advance();
        node = N.Un("not", node);
        continue;
      }
      if (this.peek().kind === "SYM" && this.peek().value === "[") {
        this.advance();
        const idx = this.parseExpr();
        this.expect("SYM","]");
        node = N.Call("番目取り出す", {"から": node, "を": idx}, false);
        continue;
      }
      break;
    }
    return node;
  }
  parseAtom() {
    const t = this.peek();
    if (t.kind === "NUM") { this.advance(); return N.Num(t.value); }
    if (t.kind === "STR_RAW")    { this.advance(); return N.Str(t.value, false); }
    if (t.kind === "STR_COOKED") { this.advance(); return N.Str(t.value, true); }
    if (t.kind === "KW" && t.value === "真") { this.advance(); return N.Bool(true); }
    if (t.kind === "KW" && t.value === "偽") { this.advance(); return N.Bool(false); }
    if (t.kind === "KW" && t.value === "無") { this.advance(); return N.None(); }
    if (t.kind === "KW" && t.value === "新しい") return this.parseNewInstance();
    if (t.kind === "KW" && t.value === "関数")   return this.parseLambda();
    if (t.kind === "SYM" && t.value === "(") {
      this.advance();
      this.skipNewlines();
      const inner = [];
      let depth = 1;
      while (depth > 0) {
        const tt = this.peek();
        if (tt.kind === "EOF") throw new ParseError("カッコが閉じていません");
        if (tt.kind === "SYM" && tt.value === "(") depth++;
        else if (tt.kind === "SYM" && tt.value === ")") { depth--; if (depth === 0) { this.advance(); break; } }
        inner.push(this.advance());
      }
      return this.parseCallFrom(inner, false);
    }
    if (t.kind === "SYM" && t.value === "[") {
      this.advance();
      const items = [];
      this.skipNewlines();
      if (!this.check("SYM","]")) {
        items.push(this.parseExpr());
        this.skipNewlines();
        while (this.match("SYM",",")) {
          this.skipNewlines();
          items.push(this.parseExpr());
          this.skipNewlines();
        }
      }
      this.skipNewlines();
      this.expect("SYM","]");
      return N.List(items);
    }
    if (t.kind === "SYM" && t.value === "{") {
      this.advance();
      const pairs = [];
      this.skipNewlines();
      if (!this.check("SYM","}")) {
        while (true) {
          this.skipNewlines();
          const k = this.parseExpr();
          this.expect("SYM","→");
          const v = this.parseExpr();
          pairs.push([k, v]);
          this.skipNewlines();
          if (!this.match("SYM",",")) break;
          this.skipNewlines();
        }
      }
      this.skipNewlines();
      this.expect("SYM","}");
      return N.Dict(pairs);
    }
    if (t.kind === "IDENT") { this.advance(); return N.Ident(t.value); }
    throw new ParseError(`${t.line}行目：式の解釈に失敗（${t.kind}:${JSON.stringify(t.value)}）`);
  }
}

// ── Environment & Function ─────────────────────────────────
class Environment {
  constructor(parent=null) {
    this.vars = new Map();
    this.consts = new Set();

function loadStdlib(env) {
  // 数学定数を環境にバインド
  env.set("円周率", Math.PI, true);
  env.set("ネイピア数", Math.E, true);
  if (typeof STDLIB_SRC === "undefined" || !STDLIB_SRC) return;
  try {
    const tokens = tokenize(STDLIB_SRC);
    const prog = new Parser(tokens).parseProgram();
    Evaluator.eval(prog, env);
  } catch (e) {
    console.warn("stdlib読み込み失敗：", e.message);
  }
}

function formatError(msg, source) {
  const m = /^(\d+)行目/.exec(msg);
  if (!m) return msg;
  const lineNo = parseInt(m[1], 10);
  const lines = source.split("\n");
  if (lineNo < 1 || lineNo > lines.length) return msg;
  const pad = " ".repeat(String(lineNo).length + 2);
  return `${msg}\n${pad}${lineNo} | ${lines[lineNo-1]}`;
}

let _lastEnv = null;
function runYui(source) {
  _outputBuf = [];
  let env;
  try {
    env = new Environment();
    loadStdlib(env);
    const tokens = tokenize(source);
    const prog = new Parser(tokens).parseProgram();
    Evaluator.eval(prog, env);
    _lastEnv = env;
    return { ok: true, output: _outputBuf.join("\n"), env };
  } catch (e) {
    _lastEnv = env;
    const raw = (e instanceof LexError || e instanceof ParseError || e instanceof RuntimeYuiError)
      ? e.message
      : `${e.name}: ${e.message}`;
    return { ok: false, output: _outputBuf.join("\n"), error: formatError(raw, source), env };
  }
}

function dumpEnv(env) {
  if (!env || !env.vars) return "（環境なし）";
  const entries = [];
  for (const [k, v] of env.vars) {
    if (k.startsWith("__") || k === "__builtins__") continue;
    if (v instanceof YuiFunction) {
      entries.push(`${k} ＝ <関数：${v.params.map(p => `[${p[0]}]${p[1]}`).join(" ")}>`);
    } else if (v instanceof Race) {
      entries.push(`${k} ＝ <種族：${v.attrs.join(", ")}>`);
    } else {
      entries.push(`${k} ＝ ${yuiToStr(v)}`);
    }
  }
  return entries.length ? entries.join("\n") : "（変数なし）";
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ── 共有 Yui 環境 ────────────── */
let yuiEnv = null;
function initYuiEnv() {
  yuiEnv = new Environment();
  loadStdlib(yuiEnv);
  // drama.yui 評価
  try {
    const t = tokenize(DRAMA_SRC);
    const p = new Parser(t).parseProgram();

    // キャラ生成
    const setup = `

`;
    const t2 = tokenize(setup);
    const p2 = new Parser(t2).parseProgram();
    Evaluator.eval(p2, yuiEnv);
  } catch (e) { console.warn("yuiEnv 初期化失敗", e); }
}

/* ── If ノードを再帰的に分解してツリーノード化 ── */
function extractBranchesFromIf(ifNode, parentId) {
  // ifNode = If(cond, then, else)
  // chained else-if は else が [If(...)] の場合
  const branches = [];
  let cur = ifNode;
  while (cur && cur.type === "If") {
    branches.push({ cond: cur.cond, body: cur.then });
    if (cur.else && cur.else.length === 1 && cur.else[0].type === "If") {
      cur = cur.else[0];
    } else {
      if (cur.else && cur.else.length > 0) {
        branches.push({ cond: null, body: cur.else }); // else (default)
      }
      cur = null;
    }
  }
  return branches;
}

/* ── 分岐内の statement から要約テキストを抽出 ── */
function summarizeBody(body) {
  let speech = "", thought = "", desc = "", delta = 0;
  for (const stmt of body) {
    try {
      if (stmt.type === "Expr" && stmt.expr.type === "Call") {
        const c = stmt.expr;
        if (c.verb === "言う" && c.args.と) {
          const v = Evaluator.eval(c.args.と, yuiEnv);
          if (typeof v === "string") speech = v;
        } else if (c.verb === "思う" && c.args.と) {
          const v = Evaluator.eval(c.args.と, yuiEnv);
          if (typeof v === "string") thought = v;
        } else if (c.verb === "描写する" && c.args.を) {
          const v = Evaluator.eval(c.args.を, yuiEnv);
          if (typeof v === "string") desc = v;
        } else if (c.verb === "好感度加算" && c.args.を) {
          const v = Evaluator.eval(c.args.を, yuiEnv);
          if (typeof v === "number") delta = v;
        }
      }
    } catch (e) {}
  }
  return { speech, thought, desc, delta };
}

/* ── 条件 cond を読みやすい文字列にする ── */
function condToText(cond) {
  if (!cond) return "（既定）";
  try {
    if (cond.type === "Bin") {
      const opMap = {">":"より大","<":"より小",">=":"以上","<=":"以下","==":"が等しい","!=":"が異なる","and":"かつ","or":"または"};
      const left = exprToText(cond.left);
      const right = exprToText(cond.right);
      return `${left} ${opMap[cond.op] || cond.op} ${right}`;
    }
    return exprToText(cond);
  } catch (e) { return "?"; }
}
function exprToText(e) {
  if (!e) return "?";
  if (e.type === "Num") return String(e.value);
  if (e.type === "Str") return `「${e.value}」`;
  if (e.type === "Ident") return e.name;
  if (e.type === "Call" && e.verb && e.args) {
    const a = Object.values(e.args).map(exprToText).join("の");
    return a + "の" + e.verb;
  }
  return "?";
}

/* ── ツリーへのノード追加 ── */
function addBranchTurn(prog) {
  // prog.body から最初の If を探す
  let ifNode = null;
  let setupStmts = [];
  for (const s of prog.body) {
    if (s.type === "If") { ifNode = s; break; }
    setupStmts.push(s);
  }
  // 場面設定など：先に評価
  for (const s of setupStmts) {
    try { Evaluator.eval(s, yuiEnv); } catch (e) {}
  }
  if (!ifNode) {
    // 分岐がない場合は全statement評価
    for (const s of prog.body) {
      try { Evaluator.eval(s, yuiEnv); } catch (e) {}
    }
    return null;
  }
  const branches = extractBranchesFromIf(ifNode);

  // 各分岐のメタ情報を取得（評価せずに要約）
  const branchInfos = branches.map(b => ({
    cond: b.cond, body: b.body,
    text: condToText(b.cond),
    summary: summarizeBody(b.body),
  }));

  // 通る枝を判定
  let chosenIdx = -1;
  for (let i = 0; i < branchInfos.length; i++) {
    const c = branchInfos[i].cond;
    if (c === null) { chosenIdx = i; break; }  // else
    try {
      const v = Evaluator.eval(c, yuiEnv);
      if (v) { chosenIdx = i; break; }
    } catch (e) {}
  }
  if (chosenIdx === -1) chosenIdx = branchInfos.length - 1;

  // ツリーに追加
  turnCount++;
  const turnId = `T${turnCount}`;
  const newNodes = [];
  for (let i = 0; i < branchInfos.length; i++) {
    const id = `${turnId}-${i}`;
    const info = branchInfos[i];
    const passed = (i === chosenIdx);
    tree.nodes.push({
      id, turn: turnCount, idx: i, passed,
      cond: info.text,
      desc: info.summary.desc, speech: info.summary.speech,
      thought: info.summary.thought, delta: info.summary.delta,
    });
    newNodes.push(id);
    if (currentNodeId) {
      tree.edges.push({ from: currentNodeId, to: id, passed });
    } else if (i === 0) {
      tree.rootId = id;
    }
  }
  // 通った枝を current に
  currentNodeId = `${turnId}-${chosenIdx}`;

  // 通った枝の body を実評価
  for (const s of branchInfos[chosenIdx].body) {
    try { Evaluator.eval(s, yuiEnv); } catch (e) {}
  }

  // 状態同期
  syncState();
  return chosenIdx;
}

function syncState() {
  try { const aoi = yuiEnv.get("葵"); if (aoi) state.葵好感度 = aoi["好感度"]; } catch (e) {}
  try { const sakura = yuiEnv.get("さくら"); if (sakura) state.さくら好感度 = sakura["好感度"]; } catch (e) {}
  try { const sc = yuiEnv.get("場面"); if (typeof sc === "string") state.場面 = sc; } catch (e) {}
  if (state.葵好感度 >= 70) state.気分 = "親密";
  else if (state.葵好感度 >= 40) state.気分 = "好意的";
  else if (state.葵好感度 >= 15) state.気分 = "中立";
  else state.気分 = "警戒";
  $("s-scene").textContent = state.場面;
  $("s-aoi").textContent = state.葵好感度;

}

/* ── SVG レンダリング ── */
/* ── ツリービューポート（パン・ズーム） ── */
const treeView = {
  vx: 0, vy: 0, vw: 800, vh: 500,  // viewBox
  contentW: 800, contentH: 500,    // 描画コンテンツの実寸
  follow: true,                    // 現在ノード追従モード
  positions: {},                   // ノードID → {x,y}
  initialized: false,
};

function renderTree() {
  const svgEl = $("tree-svg");
  // コントロール以外をクリア
  let svgNode = svgEl.querySelector("svg");
  if (tree.nodes.length === 0) {
    if (svgNode) svgNode.remove();
    return;
  }

  // ターンごとにレイアウト
  const turns = {};
  for (const n of tree.nodes) {
    if (!turns[n.turn]) turns[n.turn] = [];
    turns[n.turn].push(n);
  }
  const turnIds = Object.keys(turns).map(n => parseInt(n,10)).sort((a,b)=>a-b);
  const colWidth = 220, rowHeight = 70, padding = 30;
  const positions = {};
  let maxRows = 0;
  for (const t of turnIds) {
    const nodes = turns[t];
    maxRows = Math.max(maxRows, nodes.length);
    for (let i = 0; i < nodes.length; i++) {
      positions[nodes[i].id] = {
        x: padding + (t-1) * colWidth,
        y: padding + i * rowHeight + (3 - nodes.length) * rowHeight / 2,
      };
    }
  }
  const w = padding + colWidth * turnIds.length + 200;
  const h = padding * 2 + Math.max(maxRows, 4) * rowHeight + 60;
  treeView.contentW = w; treeView.contentH = h;
  treeView.positions = positions;

  // 初回 or follow=true なら viewBox をコンテンツに合わせる
  if (!treeView.initialized) {
    treeView.vx = 0; treeView.vy = 0;
    treeView.vw = Math.max(w, svgEl.clientWidth || 800);
    treeView.vh = Math.max(h, svgEl.clientHeight || 500);
    treeView.initialized = true;
  }

  // SVG生成
  let inner = "";
  for (const e of tree.edges) {
    const f = positions[e.from], t = positions[e.to];
    if (!f || !t) continue;
    const fx = f.x + 180, fy = f.y + 24;
    const tx = t.x, ty = t.y + 24;
    const cls = e.passed ? "edge passed" : "edge skipped";
    const cx1 = fx + 40, cx2 = tx - 40;
    inner += `<path class="${cls}" d="M${fx},${fy} C${cx1},${fy} ${cx2},${ty} ${tx},${ty}" />`;
  }
  for (const n of tree.nodes) {
    const pos = positions[n.id];
    if (!pos) continue;
    const cls = n.id === currentNodeId ? "current" : (n.passed ? "passed" : "skipped");
    const textCls = n.passed ? "" : "skipped";
    inner += `<g transform="translate(${pos.x},${pos.y})">`;
    inner += `<rect class="node-rect ${cls}" width="180" height="48" rx="6" />`;
    inner += `<text class="node-cond" x="8" y="14">T${n.turn} ${escapeHtml(n.cond.slice(0,20))}</text>`;
    const t = (n.speech || n.desc || "").slice(0, 24);
    inner += `<text class="node-text ${textCls}" x="8" y="32">${escapeHtml(t)}</text>`;
    if (n.delta) {
      const sign = n.delta > 0 ? "+" : "";
      inner += `<text class="node-text" style="fill:var(--num)" x="135" y="14">${sign}${n.delta}</text>`;
    }
    inner += `</g>`;
  }

  if (!svgNode) {
    svgEl.insertAdjacentHTML("beforeend", `<svg id="tree-svg-el" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin meet">${inner}</svg>`);
    svgNode = svgEl.querySelector("svg");
  } else {
    svgNode.innerHTML = inner;
  }

  // follow モード：現在ノードが画面外なら viewBox を寄せる
  if (treeView.follow && currentNodeId) {
    const cur = positions[currentNodeId];
    if (cur) {
      const cx = cur.x + 90, cy = cur.y + 24;
      // 現在ノードを中心に寄せる（ズーム倍率は維持）
      treeView.vx = cx - treeView.vw / 2;
      treeView.vy = cy - treeView.vh / 2;
    }
  }

  applyViewBox();
  $("tree-ind").textContent = `ノード数 ${tree.nodes.length}`;
}

function applyViewBox() {
  const svgNode = document.querySelector("#tree-svg svg");
  if (!svgNode) return;
  svgNode.setAttribute("viewBox", `${treeView.vx} ${treeView.vy} ${treeView.vw} ${treeView.vh}`);
}

function fitTree() {
  const svgEl = $("tree-svg");
  const cw = svgEl.clientWidth || 800, ch = svgEl.clientHeight || 500;
  // contentを完全に収める viewBox（aspect ratio はコンテナに合わせる）
  const aspectC = cw / ch;
  const aspectT = treeView.contentW / treeView.contentH;
  let vw, vh;
  if (aspectT > aspectC) {
    vw = treeView.contentW + 40;
    vh = vw / aspectC;
  } else {
    vh = treeView.contentH + 40;
    vw = vh * aspectC;
  }
  treeView.vw = vw; treeView.vh = vh;
  treeView.vx = (treeView.contentW - vw) / 2;
  treeView.vy = (treeView.contentH - vh) / 2;
  applyViewBox();
}

function zoomTree(factor, cx, cy) {
  // cx, cy は SVG座標系の中心点
  const newVw = Math.max(100, Math.min(20000, treeView.vw * factor));
  const newVh = Math.max(100, Math.min(20000, treeView.vh * factor));
  // 中心を維持して拡縮
  if (cx == null) { cx = treeView.vx + treeView.vw / 2; cy = treeView.vy + treeView.vh / 2; }
  treeView.vx = cx - (cx - treeView.vx) * (newVw / treeView.vw);
  treeView.vy = cy - (cy - treeView.vy) * (newVh / treeView.vh);
  treeView.vw = newVw; treeView.vh = newVh;
  applyViewBox();
}

function setupTreeInteraction() {
  const svgEl = $("tree-svg");
  let dragging = false, lastX = 0, lastY = 0;

  svgEl.addEventListener("mousedown", (e) => {
    if (e.target.closest("#tree-controls")) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    svgEl.classList.add("panning");
    treeView.follow = false;
    syncFollowBtn();
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    // 画面pixel → SVG単位
    const scale = treeView.vw / svgEl.clientWidth;
    treeView.vx -= dx * scale;
    treeView.vy -= dy * scale;
    applyViewBox();
  });
  window.addEventListener("mouseup", () => {
    if (dragging) { dragging = false; svgEl.classList.remove("panning"); }
  });
  svgEl.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = svgEl.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const cx = treeView.vx + (px / rect.width) * treeView.vw;
    const cy = treeView.vy + (py / rect.height) * treeView.vh;
    const factor = e.deltaY > 0 ? 1.15 : 1/1.15;
    zoomTree(factor, cx, cy);
  }, { passive: false });
  svgEl.addEventListener("dblclick", (e) => {
    if (e.target.closest("#tree-controls")) return;
    treeView.follow = false; syncFollowBtn();
    fitTree();
  });

  // ボタン
  $("treeFitBtn").addEventListener("click", () => {
    treeView.follow = false; syncFollowBtn();
    fitTree();
  });
  $("treeFollowBtn").addEventListener("click", () => {
    treeView.follow = !treeView.follow;
    syncFollowBtn();
    if (treeView.follow) renderTree();
  });
  $("treeZoomInBtn").addEventListener("click", () => zoomTree(1/1.3));
  $("treeZoomOutBtn").addEventListener("click", () => zoomTree(1.3));
}

function syncFollowBtn() {
  const btn = $("treeFollowBtn");
  if (!btn) return;
  btn.style.background = treeView.follow ? "rgba(217,119,87,0.5)" : "rgba(0,0,0,0.4)";
}

/* ── 物語ペイン更新 ── */
function renderStoryTurn(idx) {
  const story = $("story");
  const lastTurn = tree.nodes[tree.nodes.length-1]?.turn;
  if (!lastTurn) return;
  const turnNodes = tree.nodes.filter(n => n.turn === lastTurn);
  const passedNode = turnNodes.find(n => n.passed);
  if (!passedNode) return;

  const marker = document.createElement("div");
  marker.className = "turn-marker";
  marker.textContent = `── ターン ${lastTurn} ／ 場面：${state.場面} ──`;
  story.appendChild(marker);

  if (passedNode.desc) {
    const d = document.createElement("div"); d.className = "narration"; d.textContent = "　" + passedNode.desc;
    story.appendChild(d);
  }
  if (passedNode.thought) {
    const t = document.createElement("div"); t.className = "thought"; t.textContent = `（葵：${passedNode.thought}）`;
    story.appendChild(t);
  }
  if (passedNode.speech) {
    const s = document.createElement("div"); s.className = "speech";
    s.innerHTML = `<span class="name">葵：</span>「${escapeHtml(passedNode.speech)}」`;
    story.appendChild(s);
  }
  if (passedNode.delta) {
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = `［葵.好感度 ${passedNode.delta>0?"+":""}${passedNode.delta}］　他${turnNodes.length-1}つの未踏ルートあり`;
    story.appendChild(m);
  }
  story.scrollTop = story.scrollHeight;
}

/* ── Yui コード ── */
const KW_RE = /^(もし|そうでなければ|ならば|おわり|繰り返す|のあいだ|各|について|関数|戻り値|戻る|真|偽|無|かつ|または|でない|やめる|次へ|種族|属性|新しい|試す|ならば失敗|とする|である|せよ|だろうか|以上|以下|未満|等しい|等しくない|大きい|小さい)/;
const PT_RE = /^(から|まで|より|を|に|で|へ|と|は|が|の)(?=[^ぁ-んァ-ヶー一-龥]|$)/;
function highlightYui(line) {
  const cmIdx = line.indexOf("※");
  let head = cmIdx >= 0 ? line.slice(0, cmIdx) : line;
  let tail = cmIdx >= 0 ? line.slice(cmIdx) : "";
  let r = ""; let i = 0;
  while (i < head.length) {
    const c = head[i];
    if (c === "「" || c === "『") {
      const cl = c === "「" ? "」" : "』";
      let j = head.indexOf(cl, i+1); if (j === -1) j = head.length - 1;
      r += `<span class="tok-str">${escapeHtml(head.slice(i, j+1))}</span>`;
      i = j + 1; continue;
    }
    const sub = head.slice(i); let m;
    if ((m = sub.match(KW_RE))) { r += `<span class="tok-kw">${escapeHtml(m[0])}</span>`; i += m[0].length; }
    else if ((m = sub.match(PT_RE))) { r += `<span class="tok-particle">${escapeHtml(m[0])}</span>`; i += m[0].length; }
    else if ((m = sub.match(/^(\d[\d_.]*)/))) { r += `<span class="tok-num">${escapeHtml(m[0])}</span>`; i += m[0].length; }
    else { r += escapeHtml(c); i++; }
  }
  if (tail) r += `<span class="tok-comment">${escapeHtml(tail)}</span>`;
  return r;
}
function appendYui(src) {
  const yuiOut = $("yui-out");
  const div = document.createElement("div"); div.className = "turn";
  const head = document.createElement("div"); head.className = "turn-head"; head.textContent = `T${turnCount}`;
  const body = document.createElement("div");
  body.innerHTML = src.split("\n").map(highlightYui).join("\n");
  div.appendChild(head); div.appendChild(body);
  yuiOut.appendChild(div); yuiOut.scrollTop = yuiOut.scrollHeight;
  $("yui-ind").textContent = `行 ${src.split("\n").length * turnCount}`;
}

/* ── LLM 出力のクリーンアップ ── */
function cleanLlmYui(text) {
  let t = text.trim();
  // バッククォートコードブロック除去（開始タグ）
  t = t.replace(/```\s*yui?\s*\n?/gi, "");
  // 閉じバッククォートが現れたらそこから先を全部捨てる（解説文も一緒に消える）
  const closeIdx = t.indexOf("```");
  if (closeIdx >= 0) t = t.slice(0, closeIdx);
  t = t.trim();
  // よくある前置き「以下は〜です：」を切る
  t = t.replace(/^(以下が?|これは|出力は?)[^※もし\n]*[：:]\s*\n?/, "");
  // 末尾の解説文「これで〜」「上記が〜」を切る（最後の おわり 以降に解説が続くケース）
  const lastEnd = t.lastIndexOf("おわり");
  if (lastEnd >= 0) {
    const afterEnd = t.slice(lastEnd + 3);
    // おわり の後に説明文が続いているなら、おわり までで切る
    if (/[これそ上下この以].{0,3}(で|が|の|物語|分岐|出力|コード)/u.test(afterEnd)) {
      t = t.slice(0, lastEnd + 3);
    }
  }
  // 【】タグや解説のような行を除去（※/もし/そうで/おわり/葵/さくら/「/場面/各/関数/種族/試す で始まらない行を捨てる）
  const validStart = /^(\s*)(※|もし|そうでなければ|そうでなければもし|おわり|繰り返す|各|関数|種族|試す|戻り値|戻る|新しい|やめる|次へ|葵|さくら|「|『|場面 |[a-zA-Zぁ-んァ-ヶー一-龥]+ を |[a-zA-Zぁ-んァ-ヶー一-龥]+ は |\s*$)/;
  const lines = t.split("\n");
  const out = [];
  let inBlock = false;
  for (const line of lines) {
    if (line.trim() === "") { if (inBlock) out.push(line); continue; }
    if (line.match(/^\s*(※|もし|場面 )/) || line.match(validStart)) {
      out.push(line); inBlock = true;
    } else if (inBlock) {
      // ブロック途中なら残す（ただし【】や〔〕で囲まれた解説は除く）
      if (/^\s*[【〔]/.test(line)) continue;
      out.push(line);
    }
  }
  t = out.join("\n").trim();
  // 最初に必ず「※」「場面」「もし」のいずれかが来るよう強制
  const firstSig = t.search(/(※|場面 |もし )/);
  if (firstSig > 0) t = t.slice(firstSig);
  // 「おわり」の数が「もし」より少ない場合補完
  const ifCount = (t.match(/(?:^|\n)もし /g) || []).length;
  const endCount = (t.match(/(?:^|\n)おわり/g) || []).length;
  if (ifCount > endCount) t += "\n" + "おわり\n".repeat(ifCount - endCount);
  return t;
}

/* ── 構造化応答パーサ ── */
function sanitizeYuiText(s) {
  // Yui の文字列リテラル「…」内に入れる文字を安全化
  if (!s) return "";
  // 全角カギカッコの誤用を消去
  s = s.replace(/[「」『』]/g, "");
  // 句点や三点リーダなどはOK（文字列内なら問題なし）。改行は除去
  s = s.replace(/[\n\r]/g, " ").trim();
  // テンプレ残骸を除去：< > [ ] や ()内の指示表現
  s = s.replace(/<[^>]*>/g, "").replace(/\[[^\]]*\]/g, "");
  s = s.replace(/[（(][^）)]*(描写|心情|台詞|を入れ|内心|様子|1文)[^）)]*[）)]/g, "");
  // 制御記号
  s = s.replace(/[`'"\\]/g, "");
  // 末尾の余分な空白/句点重複
  s = s.replace(/\s+/g, " ").trim();
  // 短すぎたら空扱い
  if (s.length < 2) return "";
  // 長すぎたら40文字でカット
  if (s.length > 40) s = s.slice(0, 40);
  return s;
}

function parseStructuredBranch(text) {
  const result = { 場面: null, branches: [] };
  // 場面抽出
  const sm = text.match(/場面[:：]\s*(.+)/);
  if (sm) {
    let sc = sm[1].trim().replace(/^[「『]|[」』]$/g, "").split(/[（(\n]/)[0].trim();
    sc = sc.replace(/[<>\[\]]/g, "").slice(0, 12);
    if (sc) result.場面 = sc;
  }
  // 分岐ブロック抽出（A/B/C のラベル＋内部行）
  const blocks = text.split(/(?=分岐\s*[A-Cａ-ｃ１-３1-3]\s*[:：])/);
  for (const block of blocks) {
    const labelMatch = block.match(/^分岐\s*([A-Cａ-ｃ１-３1-3])/);
    if (!labelMatch) continue;
    const desc = block.match(/描写[:：]\s*(.+)/);
    const mind = block.match(/心情[:：]\s*(.+)/);
    const speech = block.match(/台詞[:：]\s*(.+)/);
    const delta = block.match(/変動[:：]\s*([+\-]?\d+)/);
    const b = {
      label: labelMatch[1],
      desc: sanitizeYuiText(desc?.[1] || ""),
      mind: sanitizeYuiText(mind?.[1] || ""),
      speech: sanitizeYuiText(speech?.[1] || ""),
      delta: delta ? Math.max(-10, Math.min(10, parseInt(delta[1], 10))) : 0,
    };
    // 必須フィールドが揃っていなければスキップ
    if (b.desc || b.mind || b.speech) {
      result.branches.push(b);
    }
  }
  return result;
}

/* ── 分岐の「軸」をターンごとに変える（ツリーに意味のある分岐を出す） ── */
const BRANCH_AXES = [
  // 各軸：3つの条件式（A,B,C）。Cは常に else（null）
  {
    name: "好感度",
    condA: "葵 の 好感度 が 50 以上",
    condB: "葵 の 好感度 が 20 以上",
  },
  {
    name: "さくら好感度",
    condA: "さくら の 好感度 が 50 以上",
    condB: "さくら の 好感度 が 20 以上",
  },
  {
    name: "気分",
    condA: "葵 の 気分 が 「親密」 と 等しい",
    condB: "葵 の 気分 が 「警戒」 と 等しい",
  },
  {
    name: "場面",
    condA: null,  // 動的に置換される
    condB: null,
    dynamic: true,
  },
  {
    name: "好感度差",
    condA: "葵 の 好感度 が 40 以上",
    condB: "さくら の 好感度 が 30 以下",
  },
];

function pickAxis(turn) {
  // turn 1: 好感度、turn 2: 気分、turn 3: さくら好感度、turn 4: 場面、turn 5: 差…
  const order = [0, 2, 1, 3, 4];
  return BRANCH_AXES[order[(turn - 1) % order.length]];
}

function buildDynamicCond(axis, turn, scene) {
  if (axis.name !== "場面") return { condA: axis.condA, condB: axis.condB };
  // 場面分岐：その時の場面が「特定の場所」かどうか
  const altScenes = ["教室", "屋上", "図書室", "中庭"].filter(s => s !== scene);
  const sA = scene;
  const sB = altScenes[turn % altScenes.length];
  return {
    condA: `場面 が 「${sA}」 と 等しい`,
    condB: `場面 が 「${sB}」 と 等しい`,
  };
}

/* ── 構造化 → Yui コード合成 ── */
function composeYuiFromStructured(parsed, turn) {
  const scene = parsed.場面 || state.場面 || "教室";
  const branches = parsed.branches.slice(0, 3);
  while (branches.length < 3) {
    branches.push({
      desc: "葵は無言で立っていた",
      mind: "面倒だ",
      speech: "なんだよ",
      delta: 0,
    });
  }
  const [bA, bB, bC] = branches;
  const axis = pickAxis(turn);
  const { condA, condB } = buildDynamicCond(axis, turn, scene);

  const lines = [];
  lines.push(`※ ターン${turn}：${scene}（軸：${axis.name}）`);
  lines.push(`場面 を 「${scene}」 とする`);
  lines.push(`もし ${condA} ならば`);
  if (bA.desc)   lines.push(`    「${bA.desc}」を 描写する`);
  if (bA.mind)   lines.push(`    葵 が 「${bA.mind}」と 思う`);
  if (bA.speech) lines.push(`    葵 が 「${bA.speech}」と 言う`);
  lines.push(`    葵 に ${bA.delta} を 好感度加算`);
  lines.push(`そうでなければ もし ${condB} ならば`);
  if (bB.desc)   lines.push(`    「${bB.desc}」を 描写する`);
  if (bB.mind)   lines.push(`    葵 が 「${bB.mind}」と 思う`);
  if (bB.speech) lines.push(`    葵 が 「${bB.speech}」と 言う`);
  lines.push(`    葵 に ${bB.delta} を 好感度加算`);
  lines.push(`そうでなければ`);
  if (bC.desc)   lines.push(`    「${bC.desc}」を 描写する`);
  if (bC.mind)   lines.push(`    葵 が 「${bC.mind}」と 思う`);
  if (bC.speech) lines.push(`    葵 が 「${bC.speech}」と 言う`);
  lines.push(`    葵 に ${bC.delta} を 好感度加算`);
  lines.push(`おわり`);
  return lines.join("\n");
}

async function generateBranchYui(retryHint) {
  const stateDesc = `【現在の状態】場面=${state.場面}, 葵.好感度=${state.葵好感度}, 葵.気分=${state.気分}, さくら.好感度=${state.さくら好感度}`;
  const userMsg = retryHint
    ? `前回の応答が読み取れませんでした（${retryHint}）。形式を厳守して再度書いてください。テンプレ表記の<>や[]は禁止、必ず実際の文を書く。`
    : `次のターンの3分岐を書いてください。直前と違う話題で物語を進めて。`;
  const messages = [
    { role: "system", content: SYSTEM_PROMPT + "\n\n" + stateDesc },
    { role: "user", content: userMsg },
  ];
  const reply = await engine.chat.completions.create({
    messages, temperature: 0.85, top_p: 0.92, max_tokens: 700,
    frequency_penalty: 0.4, presence_penalty: 0.3,
  });
  const raw = reply.choices[0].message.content;
  const parsed = parseStructuredBranch(raw);
  if (parsed.branches.length === 0) {
    throw new Error("構造化応答の分岐が取れず");
  }
  return composeYuiFromStructured(parsed, turnCount + 1);
}

/* ── メインループ ── */
async function autoLoop() {
  if (running || !modelLoaded) return;
  running = true; stopRequested = false;
  $("startBtn").disabled = true; $("stopBtn").disabled = false;

  if (!yuiEnv) initYuiEnv();
  let loopCount = 0;
  const MAX_TURNS = 12;

  while (!stopRequested && loopCount < MAX_TURNS) {
    loopCount++;
    $("story-ind").textContent = `T${loopCount} 推論中…`;

    let yuiSrc = "";
    let prog = null;
    let retry = 0;
    let lastErr = null;
    while (retry < 3) {
      try {
        yuiSrc = await generateBranchYui(retry > 0 ? (lastErr || "前回失敗") : null);
        if (!yuiSrc || yuiSrc.length < 20) throw new Error("空または短すぎる出力");
        const tokens = tokenize(yuiSrc);
        prog = new Parser(tokens).parseProgram();
        // 最低1つの If を含むか確認
        const hasIf = prog.body.some(s => s.type === "If");
        if (!hasIf) throw new Error("分岐 If が含まれていません");
        break;
      } catch (e) {
        retry++; lastErr = e.message;
        console.warn(`T${loopCount} 失敗（${retry}）: ${e.message}`);
        const div = document.createElement("div");
        div.className = "meta"; div.style.color = "#e07a5f";
        div.textContent = `（T${loopCount} 試行${retry}失敗：${e.message.slice(0,40)}）`;
        $("story").appendChild(div);
        prog = null;
      }
      if (stopRequested) break;
    }
    if (stopRequested) break;

    // 3回失敗ならフォールバック分岐を使う
    if (!prog) {
      yuiSrc = fallbackBranch(loopCount);
      try {
        const tokens = tokenize(yuiSrc);
        prog = new Parser(tokens).parseProgram();
        const div = document.createElement("div");
        div.className = "meta"; div.style.color = "#a8c98a";
        div.textContent = `（T${loopCount} フォールバック分岐に切替）`;
        $("story").appendChild(div);
      } catch (e) {
        const div = document.createElement("div");
        div.className = "meta"; div.style.color = "#e07a5f";
        div.textContent = `（T${loopCount} フォールバックも失敗：${e.message}）`;
        $("story").appendChild(div);
        continue;
      }
    }

    appendYui(yuiSrc);
    addBranchTurn(prog);
    renderTree();
    renderStoryTurn();
    syncState();

    if (stopRequested) break;
    await sleep(700);
  }

  $("story-ind").textContent = "停止";
  running = false;
  $("startBtn").disabled = false;
  $("stopBtn").disabled = true;
}

  ];
  engine = {
    chat: { completions: { create: async () => {
      const txt = dummies[dummyTurn % dummies.length];
      dummyTurn++;
      return { choices: [{ message: { content: txt }}]};
    }}}, interruptGenerate: () => {}
  };
});
$("startBtn").addEventListener("click", autoLoop);
$("stopBtn").addEventListener("click", () => { stopRequested = true; if (engine?.interruptGenerate) engine.interruptGenerate(); $("stopBtn").disabled = true; });
$("resetBtn").addEventListener("click", () => {
  if (running) return;
  tree.nodes = []; tree.edges = []; tree.rootId = null; currentNodeId = null;
  turnCount = 0; nodeIdSeq = 0;
  state.場面 = "教室の朝"; state.葵好感度 = 30; state.さくら好感度 = 30; state.気分 = "中立";

  const oldSvg = document.querySelector("#tree-svg svg");
  if (oldSvg) oldSvg.remove();
  treeView.initialized = false; treeView.follow = true;
  syncFollowBtn();
  yuiEnv = null;
  syncState();
});

setupTreeInteraction();
syncFollowBtn();
syncState();
