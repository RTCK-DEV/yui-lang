<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIダイアログ ── 結（Yui）× WebLLM Multi-Agent</title>
<style>
  :root {
    --bg-grad-1: #2a2330; --bg-grad-2: #1a1a2a;
    --code-bg: #0e1018; --panel: rgba(24,26,34,0.92);
    --text: #f0e8d8; --text-dim: #c0b8a8; --muted: #7a7268;
    --accent: #d97757; --accent-soft: rgba(217,119,87,0.18);
    --keyword: #d97757; --string: #a8c98a; --particle: #6f9bd1;
    --comment: #5d6478; --num: #d8a05f;
    --border: rgba(217,119,87,0.30); --border-soft: rgba(217,119,87,0.12);
    --aoi: #d97757; --sakura: #e8a5b8; --narrator: #a8c98a; --tr: #6f9bd1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
    color: var(--text); font-family: "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 10px 18px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0.1em; }
  h1 .mark { color: var(--accent); margin-right: 6px; }
  .modes { display: flex; gap: 4px; margin-left: 12px; }
  .modes button {
    background: transparent; border: 1px solid var(--border-soft); color: var(--text-dim);
    padding: 4px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .modes button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modes button:hover:not(.active) { background: var(--accent-soft); }
  .toolbar { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  button.ctrl {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button.ctrl:hover { background: var(--accent-soft); }
  button.ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ctrl.danger { background: #8a3a3a; border-color: #b04a4a; color: #fff; }
  button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }

  main {
    flex: 1; display: grid; grid-template-columns: 280px 1fr 1fr; gap: 1px;
    background: var(--border-soft); min-height: 0;
  }
  .pane { background: var(--bg-grad-2); display: flex; flex-direction: column; min-height: 0; }
  .pane-head {
    padding: 8px 14px; font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.18em;
    border-bottom: 1px solid var(--border-soft);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.18); flex-shrink: 0;
  }
  .pane-head .ind { color: var(--accent); font-family: "SF Mono", monospace; text-transform: none; letter-spacing: 0; font-size: 11px; }

  /* ── パラメータパネル ─────── */
  #param-pane { overflow-y: auto; }
  .param-section { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
  .param-section h3 { margin: 0 0 8px; font-size: 11px; color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500; }
  .param-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
  .param-row label { flex: 1; color: var(--text-dim); }
  .param-row input[type=range] { flex: 1; }
  .param-row input[type=number] { width: 60px; background: var(--code-bg); border: 1px solid var(--border-soft); color: var(--text); padding: 3px 6px; border-radius: 3px; font: inherit; font-size: 12px; }
  .param-row .v { width: 40px; text-align: right; color: var(--accent); font-family: "SF Mono", monospace; font-size: 11px; }
  .param-row input[type=checkbox] { accent-color: var(--accent); }
  .prompt-edit { width: 100%; min-height: 80px; background: var(--code-bg); color: var(--text); border: 1px solid var(--border-soft); padding: 6px 8px; border-radius: 3px; font: inherit; font-size: 11px; line-height: 1.5; resize: vertical; }
  .prompt-label { display: block; font-size: 11px; color: var(--accent); margin: 6px 0 3px; letter-spacing: 0.05em; }

  /* ── 中央：ログ ────────── */
  #log { flex: 1; overflow-y: auto; padding: 18px 22px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 14px; line-height: 1.85;
    background: linear-gradient(135deg, rgba(42,35,48,0.6), rgba(20,20,32,0.6)); }
  #log .turn { margin: 0 0 0.7em 0; opacity: 0; animation: fadeIn 0.4s forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  #log .turn.aoi { color: var(--text); }
  #log .turn.aoi .role { color: var(--aoi); font-weight: 500; }
  #log .turn.sakura { color: var(--text); }
  #log .turn.sakura .role { color: var(--sakura); font-weight: 500; }
  #log .turn.narrator { color: var(--narrator); font-style: italic; padding-left: 1em; border-left: 2px solid var(--narrator); }
  #log .turn.narrator .role { color: var(--narrator); font-weight: 500; }
  #log .turn.translation { color: var(--tr); padding-left: 1.5em; font-size: 12px; opacity: 0.75; }
  #log .turn.translation::before { content: "↳ "; }
  #log .turn.system { color: var(--muted); font-size: 11px; font-family: "SF Mono", monospace;
    text-align: center; padding: 0.4em; border: 1px dashed var(--border-soft); margin: 1em auto;
    max-width: 80%; }
  #log .turn.compress { color: var(--narrator); font-size: 11px; font-style: italic;
    padding: 0.5em 1em; border-left: 3px solid var(--narrator); background: rgba(168,201,138,0.06); margin: 0.8em 0; }
  #log .turn.code { font-family: "SF Mono", monospace; font-size: 12px; color: var(--text); background: var(--code-bg); padding: 0.6em 1em; border-radius: 4px; border-left: 3px solid var(--keyword); }

  /* ── 右：Yuiコード ───────── */
  #yui-out { flex: 1; overflow-y: auto; padding: 12px 18px;
    font-family: "SF Mono","Menlo",monospace; font-size: 12px; line-height: 1.7;
    white-space: pre-wrap; background: var(--code-bg); }
  #yui-out .turn { padding: 6px 0; border-bottom: 1px dashed var(--border-soft); margin-bottom: 6px; }
  #yui-out .turn-head { color: var(--muted); font-size: 10px; margin-bottom: 4px; }
  .tok-kw { color: var(--keyword); font-weight: 500; }
  .tok-str { color: var(--string); }
  .tok-particle { color: var(--particle); }
  .tok-comment { color: var(--comment); font-style: italic; }
  .tok-num { color: var(--num); }

  /* ── 状態バー ────────── */
  #status-bar { padding: 8px 14px; background: rgba(0,0,0,0.3);
    border-top: 1px solid var(--border-soft); font-size: 11px; color: var(--text-dim);
    display: flex; gap: 14px; flex-wrap: wrap; flex-shrink: 0; }
  #status-bar .st { display: flex; gap: 5px; align-items: center; }
  #status-bar .st .l { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
  #status-bar .st .v { color: var(--accent); font-family: "SF Mono", monospace; }

  /* ── ローダー ──────── */
  .loader-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center; z-index: 100; }
  .loader { background: var(--bg-grad-2); border: 1px solid var(--border); border-radius: 8px;
    max-width: 540px; width: 90%; padding: 28px 32px; color: var(--text); }
  .loader h2 { margin: 0 0 12px; color: var(--accent); font-size: 17px; letter-spacing: 0.1em; }
  .loader p { color: var(--text-dim); font-size: 13px; line-height: 1.85; margin: 0 0 10px; }
  .loader .progress { margin: 16px 0; height: 5px; background: var(--code-bg); border-radius: 3px; overflow: hidden; }
  .loader .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  .loader .pre-msg { font-size: 11px; color: var(--muted); font-family: "SF Mono", monospace;
    margin-top: 12px; max-height: 70px; overflow-y: auto; padding: 6px 8px;
    background: var(--code-bg); border-radius: 3px; }
  .loader-actions { margin-top: 14px; display: flex; gap: 10px; justify-content: flex-end; }

  footer { padding: 5px 18px; color: var(--muted); font-size: 10px; text-align: right;
    background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-soft); flex-shrink: 0; }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1fr; } #param-pane { max-height: 200px; } }
</style>
</head>
<body>
<header>
  <h1><span class="mark">結</span>AIダイアログ</h1>
  <div class="modes" id="modes">
    <button data-mode="duo" class="active">2者対話</button>
    <button data-mode="trio">3者対話</button>
    <button data-mode="reverse">逆転</button>
    <button data-mode="bilingual">言語実験</button>
    <button data-mode="code">コードで話す</button>
  </div>
  <div class="toolbar">
    <button class="ctrl" id="interventBtn" disabled>⛅ 介入</button>
    <button class="ctrl" id="resetBtn">リセット</button>
    <button class="ctrl danger" id="stopBtn" disabled>■ 停止</button>
    <button class="ctrl primary" id="startBtn" disabled>▶ 開始</button>
  </div>
</header>
<main>
  <div class="pane" id="param-pane">
    <div class="pane-head"><span>PARAMETERS</span><span class="ind" id="mode-ind">2者対話</span></div>
    <div class="param-section">
      <h3>推論</h3>
      <div class="param-row"><label>温度</label><input type="range" id="p-temp" min="0" max="20" value="8"><span class="v" id="p-temp-v">0.80</span></div>
      <div class="param-row"><label>top_p</label><input type="range" id="p-topp" min="0" max="100" value="95"><span class="v" id="p-topp-v">0.95</span></div>
      <div class="param-row"><label>max_tokens</label><input type="number" id="p-maxtok" min="20" max="400" value="100"></div>
      <div class="param-row"><label>反復ペナルティ</label><input type="range" id="p-rep" min="100" max="200" value="115"><span class="v" id="p-rep-v">1.15</span></div>
    </div>
    <div class="param-section">
      <h3>進行</h3>
      <div class="param-row"><label>ターン間隔(ms)</label><input type="number" id="p-delay" min="0" max="5000" value="500"></div>
      <div class="param-row"><label>履歴サイズ</label><input type="number" id="p-ctx" min="2" max="20" value="6"></div>
      <div class="param-row"><label>圧縮間隔</label><input type="number" id="p-comp" min="2" max="20" value="3"></div>
      <div class="param-row"><label>場面遷移ターン</label><input type="number" id="p-scene" min="3" max="50" value="8"></div>
      <div class="param-row"><label>自動介入頻度</label><input type="range" id="p-autointer" min="0" max="100" value="20"><span class="v" id="p-autointer-v">20%</span></div>
    </div>
    <div class="param-section">
      <h3>システムプロンプト</h3>
      <span class="prompt-label">葵</span>
      <textarea class="prompt-edit" id="prompt-aoi"></textarea>
      <span class="prompt-label">さくら</span>
      <textarea class="prompt-edit" id="prompt-sakura"></textarea>
      <span class="prompt-label">ナレーター（3者対話時）</span>
      <textarea class="prompt-edit" id="prompt-narrator"></textarea>
    </div>
  </div>

  <div class="pane" id="log-pane">
    <div class="pane-head"><span>LOG</span><span class="ind" id="status-indicator">準備中</span></div>
    <div id="log"><div class="turn system">モデルロード後、モードを選んで「開始」を押してください。</div></div>
    <div id="status-bar">
      <div class="st"><span class="l">場面</span><span class="v" id="s-scene">教室の朝</span></div>
      <div class="st"><span class="l">時刻</span><span class="v" id="s-time">朝</span></div>
      <div class="st"><span class="l">葵→さくら</span><span class="v" id="s-aoi">30</span></div>
      <div class="st"><span class="l">さくら→葵</span><span class="v" id="s-sakura">30</span></div>
      <div class="st"><span class="l">ターン</span><span class="v" id="s-turn">0</span></div>
      <div class="st"><span class="l">圧縮</span><span class="v" id="s-comp">なし</span></div>
    </div>
  </div>

  <div class="pane" id="yui-pane">
    <div class="pane-head"><span>GENERATED YUI</span><span class="ind" id="yui-ind">行 0</span></div>
    <div id="yui-out"></div>
  </div>
</main>
<footer>結（Yui）v1.0 ／ WebLLM（モデルは上部で選択）／ Multi-Agent ／ © RTCK</footer>

<div id="loader" class="loader-overlay">
  <div class="loader">
    <h2>WebLLM 起動 ── モデル選択</h2>
    <p>使うモデルを選んで「▶ ロード開始」を押してください。完全ローカル動作。</p>
    <select id="model-select" style="width:100%; background:var(--code-bg); color:var(--text); border:1px solid var(--border); padding:10px 12px; border-radius:4px; font:inherit; font-size:13px; margin:8px 0 14px">
      <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC" selected>Llama 3.2 3B Instruct（1.9GB・推奨）</option>
      <option value="Qwen2.5-3B-Instruct-q4f16_1-MLC">Qwen 2.5 3B Instruct（2.0GB・日本語強）</option>
      <option value="Hermes-3-Llama-3.2-3B-q4f16_1-MLC">Hermes 3 Llama 3.2 3B（1.9GB・キャラ演技）</option>
      <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi 3.5 Mini（2.4GB）</option>
      <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B（0.8GB・最軽量）</option>
      <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2 2B Instruct（1.5GB・参考）</option>
    </select>
    <div class="progress" id="progress-wrap" style="display:none"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="pre-msg" id="loader-msg" style="display:none">準備中…</div>
    <div class="loader-actions">
      <button class="ctrl" id="loader-skip">スキップ（オフラインデモ）</button>
      <button class="ctrl primary" id="loader-start">▶ ロード開始</button>
    </div>
  </div>
</div>

<script type="module">/* ── YUI:BEGIN ── tools/build_html.py が yui.js と stdlib.yui から生成する。直接編集しないこと ── */
/* ============================================================
 * 結（Yui）言語 — ブラウザ実装（インタプリタ本体）
 *
 * このファイルが JavaScript 実装の唯一の原本。
 * repl.html / drama_player.html / ai_player.html / ai_dialog.html /
 * ai_branch.html の5つは、tools/build_html.py がこの内容と stdlib.yui を
 * 各 HTML へ埋め込んで生成する。HTML 側の埋め込みブロックを直接編集しても
 * 次のビルドで上書きされる。編集はここに対して行うこと。
 *
 * 各 HTML はこのコアの「後ろ」に自分の UI と固有の組み込み関数を足す。
 * 例：drama_player.html は 表示 / 入力 を差し替え、劇用の関数を追加する。
 *
 * Python リファレンス実装は ../yui.py。両者の挙動差は
 * tools/diff_impls.py で測れる。
 *
 * 著作権表記：RTCK
 * ============================================================ */

"use strict";
/* ============================================================
 * 結（Yui）言語 — JavaScript実装（Python版と同等）
 * ============================================================ */

// ── 文字正規化 ──────────────────────────────────────────────
const ZEN2HAN = {
  "０":"0","１":"1","２":"2","３":"3","４":"4",
  "５":"5","６":"6","７":"7","８":"8","９":"9",
  "＋":"+","－":"-","×":"*","÷":"/","％":"%",
  "＝":"=","＜":"<","＞":">",
  "（":"(","）":")","［":"[","］":"]","｛":"{","｝":"}",
  "：":":","　":" ",
};
const KAN_DIGIT = {"零":0,"〇":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
const KAN_UNIT  = {"十":10,"百":100,"千":1000,"万":10000,"億":100000000};

function normChar(c) { return ZEN2HAN[c] || c; }

function kan2int(s) {
  if (!s) return null;
  for (const c of s) if (!(c in KAN_DIGIT) && !(c in KAN_UNIT)) return null;
  let total = 0, section = 0, current = 0;
  for (const c of s) {
    if (c in KAN_DIGIT) {
      current = KAN_DIGIT[c];
    } else {
      const unit = KAN_UNIT[c];
      if (unit >= 10000) {
        let base = section + current;
        if (base === 0) base = 1;
        section = base * unit;
        total += section;
        section = 0;
      } else {
        section += (current || 1) * unit;
      }
      current = 0;
    }
  }
  return total + section + current;
}

// ── 字句解析 ────────────────────────────────────────────────
const PARTICLES = ["から","まで","より","について","を","に","で","へ","と","は","が","の"];
const KEYWORDS  = [
  "もし","ならば","そうでなければ","おわり",
  "繰り返す","のあいだ","各",
  "関数","戻り値","戻る",
  "真","偽","無",
  "かつ","または","でない",
  "とする","である","せよ","だろうか",
  "以上","以下","未満",
  "等しい","等しくない","大きい","小さい",
  "やめる","次へ",
  "種族","属性","新しい",
  "試す","ならば失敗",
];
const KW_OR_PARTICLE_SORTED = [...new Set([...KEYWORDS, ...PARTICLES])].sort((a,b)=>b.length-a.length);

const RE_IDENT_START = /[ぁ-んァ-ヶー一-龥a-zA-Z_々〆ヵヶ]/;
const RE_IDENT_CHAR  = /[ぁ-んァ-ヶー一-龥a-zA-Z_0-9々〆ヵヶ]/;

function matchKwOrParticle(src, i) {
  for (const w of KW_OR_PARTICLE_SORTED) {
    if (src.startsWith(w, i)) return w;
  }
  return null;
}

/**
 * 助詞を含む組み込み関数名の一覧を長い順で返す。yui.py の
 * _composite_builtin_names と対。
 *
 * 「文字列にする」のような名前は助詞「に」の位置で識別子が切れてしまい、
 * そのままでは呼び出せない（「文字列」「に」「する」の3トークンになる）。
 * 字句解析の時点で1つの識別子として切り出すことで、通常の呼び出し・
 * 「の」後置記法・高階関数への文字列渡しのすべてで到達できるようにする。
 *
 * 一覧は BUILTINS から導出するので、助詞入りの組み込みが増えても追随する。
 */
let _compositeBuiltins = null;
function compositeBuiltinNames() {
  if (_compositeBuiltins === null) {
    _compositeBuiltins = Object.keys(BUILTINS)
      .filter(name => {
        for (let k = 1; k < name.length; k++) if (matchKwOrParticle(name, k)) return true;
        return false;
      })
      .sort((a, b) => b.length - a.length);
  }
  return _compositeBuiltins;
}

class LexError extends Error {}
class ParseError extends Error {}
class RuntimeYuiError extends Error {}

function tokenize(src) {
  const tokens = [];
  let i = 0, line = 1;
  const n = src.length;
  const emit = (kind, value) => tokens.push({kind, value, line});

  while (i < n) {
    const c = src[i];

    if (c === "\n") {
      if (tokens.length && tokens[tokens.length-1].kind !== "NEWLINE") emit("NEWLINE","\n");
      line++; i++; continue;
    }
    if (" \t\r　、，".includes(c)) { i++; continue; }

    if (c === "※") {
      while (i < n && src[i] !== "\n") i++;
      continue;
    }
    if (c === "〔") {
      let depth = 1; i++;
      while (i < n && depth > 0) {
        if (src[i]==="〔") depth++;
        else if (src[i]==="〕") depth--;
        else if (src[i]==="\n") line++;
        i++;
      }
      continue;
    }

    if (c === "「" || c === "『") {
      const close = c === "「" ? "」" : "』";
      const isRaw = c === "「";
      i++;
      let buf = "";
      while (i < n && src[i] !== close) {
        if (!isRaw && src[i] === "\\" && i+1 < n) {
          const nx = src[i+1];
          buf += {"n":"\n","t":"\t","r":"\r","\\":"\\","「":"「","」":"」","『":"『","』":"』","{":"","}":""}[nx] || nx;
          i += 2;
        } else {
          if (src[i] === "\n") line++;
          buf += src[i]; i++;
        }
      }
      if (i >= n) throw new LexError(`${line}行目：文字列リテラルが閉じていません`);
      i++;
      emit(isRaw ? "STR_RAW" : "STR_COOKED", buf);
      continue;
    }

    const nc = normChar(c);
    if (/[0-9]/.test(nc)) {
      let j = i, buf = "";
      while (j < n) {
        const cn = normChar(src[j]);
        if (cn === "_") { j++; continue; }       // 桁区切り
        if (/[0-9]/.test(cn) || cn === ".") { buf += cn; j++; }
        else break;
      }
      const val = buf.includes(".") ? parseFloat(buf) : parseInt(buf, 10);
      emit("NUM", val);
      i = j; continue;
    }

    if (c in KAN_DIGIT || c in KAN_UNIT) {
      let j = i;
      while (j < n && (src[j] in KAN_DIGIT || src[j] in KAN_UNIT)) j++;
      const ok = (j === n) || !RE_IDENT_CHAR.test(src[j]) || matchKwOrParticle(src, j);
      if (ok) {
        const v = kan2int(src.slice(i, j));
        if (v !== null) {
          emit("NUM", v); i = j; continue;
        }
      }
    }

    // 多文字記号
    let matchedSym = null;
    for (const sym of ["==","!=","<=",">=","≠","≦","≧"]) {
      if (src.startsWith(sym, i)) {
        matchedSym = ({"≠":"!=","≦":"<=","≧":">="})[sym] || sym;
        i += sym.length; break;
      }
    }
    if (matchedSym) { emit("SYM", matchedSym); continue; }

    if (c === "→") { emit("SYM", "→"); i++; continue; }

    if ("+-*/%=()[]{}:,.<>".includes(nc)) {
      emit("SYM", nc); i++; continue;
    }

    // 助詞を含む組み込み関数名（「文字列にする」など）は分割せず1識別子にする。
    // 直後が識別子文字なら別の名前なので対象外（「整数にする2」など）。
    let composite = null;
    for (const cname of compositeBuiltinNames()) {
      if (src.startsWith(cname, i)) {
        const j = i + cname.length;
        if (j >= n || !RE_IDENT_CHAR.test(src[j])) { composite = cname; break; }
      }
    }
    if (composite) { emit("IDENT", composite); i += composite.length; continue; }

    const kp = matchKwOrParticle(src, i);
    if (kp) {
      emit(kp.length >= 0 && KEYWORDS.includes(kp) ? "KW" : "PARTICLE", kp);
      i += kp.length; continue;
    }

    if (RE_IDENT_START.test(c)) {
      let j = i + 1;
      while (j < n) {
        if (!RE_IDENT_CHAR.test(src[j])) break;
        if (matchKwOrParticle(src, j)) break;
        j++;
      }
      emit("IDENT", src.slice(i, j));
      i = j; continue;
    }

    throw new LexError(`${line}行目：解釈できない文字「${c}」(U+${c.codePointAt(0).toString(16).toUpperCase()})`);
  }
  if (tokens.length && tokens[tokens.length-1].kind !== "NEWLINE") emit("NEWLINE","\n");
  emit("EOF", null);
  return tokens;
}

// ── AST ─────────────────────────────────────────────────────
const N = {
  Num:   (v)             => ({type:"Num", value:v}),
  Str:   (v,cooked)      => ({type:"Str", value:v, isCooked: !!cooked}),
  Bool:  (v)             => ({type:"Bool", value:v}),
  None:  ()              => ({type:"None"}),
  Ident: (n)             => ({type:"Ident", name:n}),
  List:  (items)         => ({type:"List", items}),
  Dict:  (pairs)         => ({type:"Dict", pairs}),
  Bin:   (op,l,r)        => ({type:"Bin", op, left:l, right:r}),
  Un:    (op,o)          => ({type:"Un", op, operand:o}),
  Call:  (verb,args,cmd) => ({type:"Call", verb, args, isCmd: cmd||false}),
  Assign:(name,val,c)    => ({type:"Assign", name, value:val, isConst:c}),
  If:    (c,t,e)         => ({type:"If", cond:c, then:t, else:e}),
  While: (c,b)           => ({type:"While", cond:c, body:b}),
  ForR:  (v,s,e,b)       => ({type:"ForR", var:v, start:s, end:e, body:b}),
  ForE:  (v,it,b)        => ({type:"ForE", var:v, iter:it, body:b}),
  Func:  (verb,p,b)      => ({type:"Func", verb, params:p, body:b}),
  Ret:   (v)             => ({type:"Ret", value:v}),
  Topic: (t,b)           => ({type:"Topic", topic:t, body:b}),
  Expr:  (e)             => ({type:"Expr", expr:e}),
  Prog:  (b)             => ({type:"Prog", body:b}),
  Brk:   ()              => ({type:"Brk"}),
  Cont:  ()              => ({type:"Cont"}),
  RaceDef:(name,attrs)   => ({type:"RaceDef", name, attrs}),
  New:   (race,fields)   => ({type:"New", race, fields}),
  Try:   (tb, cb)        => ({type:"Try", tryBody:tb, catchBody:cb}),
  Lambda:(params, body)  => ({type:"Lambda", params, body}),
};

// ── Parser ──────────────────────────────────────────────────
class Parser {
  constructor(tokens) { this.tokens = tokens; this.pos = 0; }
  peek(o=0) { return this.tokens[this.pos+o]; }
  advance() { return this.tokens[this.pos++]; }
  check(kind, value) {
    const t = this.peek();
    if (t.kind !== kind) return false;
    if (value !== undefined && t.value !== value) return false;
    return true;
  }
  match(kind, value) { return this.check(kind, value) ? this.advance() : null; }
  expect(kind, value) {
    const t = this.peek();
    if (!this.check(kind, value)) throw new ParseError(`${t.line}行目：期待 ${kind}(${value}) 実際 ${t.kind}(${JSON.stringify(t.value)})`);
    return this.advance();
  }
  skipNewlines() { while (this.check("NEWLINE")) this.advance(); }

  parseProgram() {
    const body = [];
    this.skipNewlines();
    while (!this.check("EOF")) {
      const s = this.parseStatement();
      if (s) body.push(s);
      this.skipNewlines();
    }
    return N.Prog(body);
  }

  parseStatement() {
    if (this.check("KW","もし")) return this.parseIf();
    if (this.check("KW","各")) return this.parseFor();
    if (this.check("KW","関数") && this.peek(1).kind === "SYM" && this.peek(1).value === ":") return this.parseFuncDef();
    if (this.check("KW","戻り値")) return this.parseReturnValue();
    if (this.check("KW","戻る")) { this.advance(); return N.Ret(null); }
    if (this.check("KW","やめる")) { this.advance(); return N.Brk(); }
    if (this.check("KW","次へ"))   { this.advance(); return N.Cont(); }
    if (this.check("KW","種族"))   return this.parseRaceDef();
    if (this.check("KW","試す"))   return this.parseTry();
    const line = this.collectLine();
    return this.parseLine(line);
  }

  collectLine() {
    const toks = [];
    let depth = 0;
    while (!this.check("EOF")) {
      const t = this.peek();
      if (t.kind === "NEWLINE" && depth === 0) { this.advance(); break; }
      if (t.kind === "SYM" && "([{".includes(t.value)) depth++;
      else if (t.kind === "SYM" && ")]}".includes(t.value)) depth--;
      toks.push(this.advance());
    }
    return toks;
  }

  parseLine(toks) {
    if (!toks.length) return null;

    if (toks.length >= 2 && toks[toks.length-1].value === "繰り返す" && toks[toks.length-2].value === "のあいだ") {
      const cond = this.parseExprFrom(toks.slice(0, -2));
      const body = this.parseBlockUntil(["おわり"]);
      return N.While(cond, body);
    }

    const last = toks[toks.length-1];
    if (last.kind === "PARTICLE" && last.value === "について") {
      const topic = this.parseExprFrom(toks.slice(0, -1));
      const body = this.parseBlockUntil(["おわり"]);
      return N.Topic(topic, body);
    }
    if (last.kind === "KW" && last.value === "とする") return this.parseAssign(toks.slice(0,-1), false);
    if (last.kind === "KW" && last.value === "である") return this.parseAssign(toks.slice(0,-1), true);
    if (last.kind === "KW" && last.value === "せよ") {
      const expr = this.parseCallFrom(toks.slice(0,-1), true);
      return N.Expr(expr);
    }
    if (last.kind === "KW" && last.value === "だろうか") {
      return N.Expr(this.parseExprFrom(toks.slice(0,-1)));
    }
    return N.Expr(this.parseExprFrom(toks));
  }

  parseAssign(toks, isConst) {
    if (!toks.length || toks[0].kind !== "IDENT") throw new ParseError("代入文の左辺は識別子");
    const name = toks[0].value;
    if (toks.length < 3 || toks[1].kind !== "PARTICLE" || !["を","は"].includes(toks[1].value))
      throw new ParseError(`${toks[0].line}行目：代入は「<名前>を/は <式>」の形`);
    const rhs = this.parseExprFrom(toks.slice(2));
    return N.Assign(name, rhs, isConst);
  }

  parseIf() {
    this.expect("KW","もし");
    const condToks = [];
    while (!this.check("KW","ならば")) {
      if (this.check("EOF") || this.check("NEWLINE")) throw new ParseError("もし文に「ならば」がありません");
      condToks.push(this.advance());
    }
    this.expect("KW","ならば");
    this.skipNewlines();
    const then = [];
    while (!this.check("KW","そうでなければ") && !this.check("KW","おわり")) {
      if (this.check("EOF")) throw new ParseError("もし文に「おわり」がありません");
      const s = this.parseStatement();
      if (s) then.push(s);
      this.skipNewlines();
    }
    let elseBody = [];
    if (this.match("KW","そうでなければ")) {
      if (this.check("KW","もし")) {
        elseBody = [this.parseIf()];
        return N.If(this.parseExprFrom(condToks), then, elseBody);
      }
      this.skipNewlines();
      while (!this.check("KW","おわり")) {
        if (this.check("EOF")) throw new ParseError("もし文に「おわり」がありません");
        const s = this.parseStatement();
        if (s) elseBody.push(s);
        this.skipNewlines();
      }
    }
    this.expect("KW","おわり");
    return N.If(this.parseExprFrom(condToks), then, elseBody);
  }

  parseFor() {
    this.expect("KW","各");
    const varTok = this.expect("IDENT");
    this.expect("PARTICLE","を");
    const bodyToks = [];
    while (!this.check("KW","繰り返す")) {
      if (this.check("EOF") || this.check("NEWLINE")) throw new ParseError("各文に「繰り返す」がありません");
      bodyToks.push(this.advance());
    }
    this.expect("KW","繰り返す");
    if (bodyToks.length && bodyToks[bodyToks.length-1].kind === "PARTICLE" && bodyToks[bodyToks.length-1].value === "について") {
      const it = this.parseExprFrom(bodyToks.slice(0,-1));
      const block = this.parseBlockUntil(["おわり"]);
      return N.ForE(varTok.value, it, block);
    }
    let kara = -1, made = -1;
    bodyToks.forEach((t,i) => {
      if (t.kind === "PARTICLE" && t.value === "から") kara = i;
      if (t.kind === "PARTICLE" && t.value === "まで") made = i;
    });
    if (kara === -1 || made === -1 || made <= kara) throw new ParseError("各文は「<開始>から<終了>まで」または「<配列>について」");
    const start = this.parseExprFrom(bodyToks.slice(0, kara));
    const end   = this.parseExprFrom(bodyToks.slice(kara+1, made));
    const block = this.parseBlockUntil(["おわり"]);
    return N.ForR(varTok.value, start, end, block);
  }

  parseFuncDef() {
    this.expect("KW","関数");
    this.expect("SYM",":");
    const sig = [];
    while (!this.check("NEWLINE") && !this.check("EOF")) sig.push(this.advance());
    this.expect("NEWLINE");
    const params = [];
    const verbParts = [];
    let i = 0;
    while (i < sig.length) {
      const t = sig[i];
      if (t.kind === "SYM" && t.value === "[") {
        if (i+2 >= sig.length) throw new ParseError("関数シグネチャ：[]助詞が壊れています");
        const nameTok = sig[i+1];
        if (sig[i+2].kind !== "SYM" || sig[i+2].value !== "]") throw new ParseError("関数シグネチャ：]がありません");
        const pTok = sig[i+3];
        if (!pTok || pTok.kind !== "PARTICLE") throw new ParseError("関数シグネチャ：仮引数の後に助詞が必要");
        params.push([nameTok.value, pTok.value]);
        i += 4;
      } else {
        if (t.kind === "IDENT" || t.kind === "KW") verbParts.push(t.value);
        i++;
      }
    }
    const verb = verbParts.join("");
    const body = this.parseBlockUntil(["おわり"]);
    return N.Func(verb, params, body);
  }

  parseReturnValue() {
    this.expect("KW","戻り値");
    this.expect("SYM",":");
    const toks = this.collectLine();
    return N.Ret(this.parseExprFrom(toks));
  }

  parseTry() {
    this.expect("KW","試す");
    this.skipNewlines();
    const tryBody = [];
    while (!this.check("KW","ならば失敗")) {
      if (this.check("EOF")) throw new ParseError("試す文に「ならば失敗」がありません");
      const s = this.parseStatement();
      if (s) tryBody.push(s);
      this.skipNewlines();
    }
    this.expect("KW","ならば失敗");
    this.skipNewlines();
    const catchBody = [];
    while (!this.check("KW","おわり")) {
      if (this.check("EOF")) throw new ParseError("試す文に「おわり」がありません");
      const s = this.parseStatement();
      if (s) catchBody.push(s);
      this.skipNewlines();
    }
    this.advance();
    return N.Try(tryBody, catchBody);
  }

  parseLambda() {
    this.expect("KW","関数");
    this.expect("SYM","(");
    const params = [];
    while (!this.check("SYM",")")) {
      this.expect("SYM","[");
      const name = this.expect("IDENT").value;
      this.expect("SYM","]");
      const pt = this.peek();
      if (pt.kind !== "PARTICLE") throw new ParseError(`${pt.line}行目：ラムダ仮引数の後に助詞が必要`);
      this.advance();
      params.push([name, pt.value]);
    }
    this.expect("SYM",")");
    const body = this.parseExpr();
    return N.Lambda(params, body);
  }

  parseRaceDef() {
    this.expect("KW","種族");
    const name = this.expect("IDENT").value;
    this.expect("SYM",":");
    this.skipNewlines();
    const attrs = [];
    while (!this.check("KW","おわり")) {
      if (this.check("EOF")) throw new ParseError("種族定義に「おわり」がありません");
      if (this.check("KW","属性")) {
        this.advance();
        this.expect("SYM",":");
        attrs.push(this.expect("IDENT").value);
        while (this.match("SYM",",")) attrs.push(this.expect("IDENT").value);
        this.skipNewlines();
      } else {
        throw new ParseError(`${this.peek().line}行目：種族定義中に「属性：」が必要`);
      }
    }
    this.advance();
    return N.RaceDef(name, attrs);
  }
  parseNewInstance() {
    this.expect("KW","新しい");
    const race = this.expect("IDENT").value;
    this.expect("SYM","(");
    this.skipNewlines();
    const fields = {};
    if (!this.check("SYM",")")) {
      while (true) {
        this.skipNewlines();
        const k = this.expect("IDENT").value;
        this.expect("SYM","→");
        fields[k] = this.parseExpr();
        this.skipNewlines();
        if (!this.match("SYM",",")) break;
        this.skipNewlines();
      }
    }
    this.skipNewlines();
    this.expect("SYM",")");
    return N.New(race, fields);
  }

  parseBlockUntil(terminators) {
    const body = [];
    this.skipNewlines();
    while (!terminators.some(t => this.check("KW", t))) {
      if (this.check("EOF")) throw new ParseError(`ブロックの終端 ${terminators} が見つかりません`);
      const s = this.parseStatement();
      if (s) body.push(s);
      this.skipNewlines();
    }
    this.advance();
    return body;
  }

  parseExprFrom(toks) {
    // yui.py の _parse_expr_from と同じ順序：まず式として解析し、
    // トークンが余った場合にかぎり「項助詞…動詞」の呼び出しとして解釈し直す。
    // 呼び出しを先に試すと「i が B 以下」の tail が [B, 以下] になり、
    // 単独比較語ガードをすり抜けて関数「B以下」の呼び出しになってしまう。
    const pad = () => [{kind:"NEWLINE",value:"\n",line:0}, {kind:"EOF",value:null,line:0}];
    const sub = new Parser([...toks, ...pad()]);
    const node = sub.parseExpr();
    if (!(sub.check("NEWLINE") || sub.check("EOF"))) {
      const sub2 = new Parser([...toks, ...pad()]);
      return sub2.parseCallOrExpr();
    }
    return node;
  }

  parseCallFrom(toks, isCmd) {
    const sub = new Parser([...toks, {kind:"NEWLINE",value:"\n",line:0}, {kind:"EOF",value:null,line:0}]);
    const node = sub.parseCallOrExpr();
    if (node.type === "Call") node.isCmd = isCmd;
    return node;
  }

  parseCallOrExpr() {
    const saved = this.pos;
    const pieces = this.scanPieces();
    if (!pieces) {
      this.pos = saved;
      return this.parseExpr();
    }
    const [seg, particles, tail] = pieces;
    const args = {};
    seg.forEach((s, idx) => {
      args[particles[idx]] = this.parseExprFrom(s);
    });
    const verb = tail.map(t=>t.value).join("");
    return N.Call(verb, args, false);
  }

  scanPieces() {
    let seg = [[]];
    const particles = [];
    let depth = 0;
    const toks = [];
    while (!this.check("NEWLINE") && !this.check("EOF")) toks.push(this.advance());
    for (const t of toks) {
      if (t.kind === "SYM" && "([{".includes(t.value)) { depth++; seg[seg.length-1].push(t); continue; }
      if (t.kind === "SYM" && ")]}".includes(t.value)) { depth--; seg[seg.length-1].push(t); continue; }
      // 「の」「は」は scan_pieces では区切らない（前者はpostfix、後者は代入と衝突）
      if (depth === 0 && t.kind === "PARTICLE" && ["を","に","で","へ","と","から","まで","より","が"].includes(t.value)) {
        particles.push(t.value);
        seg.push([]);
        continue;
      }
      seg[seg.length-1].push(t);
    }
    if (!particles.length) return null;
    const tail = seg[seg.length-1];
    seg = seg.slice(0, -1);
    if (seg.length !== particles.length) return null;
    if (!tail.length || tail.some(t => t.kind !== "IDENT" && t.kind !== "KW")) return null;
    // 末尾が比較語なら呼び出しではなく式扱い
    if (tail.length === 1 && tail[0].kind === "KW" &&
        ["大きい","小さい","以上","以下","未満","等しい","等しくない"].includes(tail[0].value)) return null;
    return [seg, particles, tail];
  }

  parseExpr() { return this.parseOr(); }
  parseOr() {
    let l = this.parseAnd();
    while (this.check("KW","または")) { this.advance(); l = N.Bin("or", l, this.parseAnd()); }
    return l;
  }
  parseAnd() {
    let l = this.parseNot();
    while (this.check("KW","かつ")) { this.advance(); l = N.Bin("and", l, this.parseNot()); }
    return l;
  }
  parseNot() {
    if (this.match("KW","でない")) return N.Un("not", this.parseNot());
    return this.parseCompare();
  }
  parseCompare() {
    const left = this.parseAdd();

    // 「が」マーカー：比較式として試行、失敗したら巻き戻して呼び出しに譲る
    if (this.peek().kind === "PARTICLE" && this.peek().value === "が") {
      const save = this.pos;
      try {
        this.advance();
        const right = this.parseAdd();
        if (this.match("PARTICLE","より")) {
          if (this.match("KW","大きい")) return N.Bin(">",  left, right);
          if (this.match("KW","小さい")) return N.Bin("<",  left, right);
          if (this.match("KW","以上"))   return N.Bin(">=", left, right);
          if (this.match("KW","以下"))   return N.Bin("<=", left, right);
          if (this.match("KW","未満"))   return N.Bin("<",  left, right);
          throw new ParseError("「より」の後に比較語が必要");
        }
        if (this.match("PARTICLE","と")) {
          if (this.match("KW","等しい"))     return N.Bin("==", left, right);
          if (this.match("KW","等しくない")) return N.Bin("!=", left, right);
          throw new ParseError("「と」の後に比較語が必要");
        }
        if (this.match("KW","以上")) return N.Bin(">=", left, right);
        if (this.match("KW","以下")) return N.Bin("<=", left, right);
        if (this.match("KW","未満")) return N.Bin("<",  left, right);
        const t2 = this.peek();
        if (t2.kind === "SYM" && ["==","!=","<",">","<=",">="].includes(t2.value)) {
          const op = this.advance().value;
          return N.Bin(op, right, this.parseAdd());
        }
        throw new ParseError("「が」の後に比較形式が必要");
      } catch (e) {
        if (e instanceof ParseError) { this.pos = save; }
        else throw e;
      }
    }

    const t = this.peek();
    if (t.kind === "SYM" && ["==","!=","<",">","<=",">="].includes(t.value)) {
      const op = this.advance().value;
      return N.Bin(op, left, this.parseAdd());
    }
    if (t.kind === "PARTICLE" && t.value === "より") {
      const save = this.pos;
      this.advance();
      const right = this.parseAdd();
      if (this.match("KW","大きい")) return N.Bin(">",  left, right);
      if (this.match("KW","小さい")) return N.Bin("<",  left, right);
      if (this.match("KW","以上"))   return N.Bin(">=", left, right);
      if (this.match("KW","以下"))   return N.Bin("<=", left, right);
      if (this.match("KW","未満"))   return N.Bin("<",  left, right);
      this.pos = save;
    }
    if (t.kind === "PARTICLE" && t.value === "と") {
      const save = this.pos;
      this.advance();
      const right = this.parseAdd();
      if (this.match("KW","等しい"))     return N.Bin("==", left, right);
      if (this.match("KW","等しくない")) return N.Bin("!=", left, right);
      this.pos = save;
    }
    return left;
  }
  parseAdd() {
    let l = this.parseMul();
    while (this.peek().kind === "SYM" && ["+","-"].includes(this.peek().value)) {
      const op = this.advance().value;
      l = N.Bin(op, l, this.parseMul());
    }
    return l;
  }
  parseMul() {
    let l = this.parseUnary();
    while (this.peek().kind === "SYM" && ["*","/","%"].includes(this.peek().value)) {
      const op = this.advance().value;
      l = N.Bin(op, l, this.parseUnary());
    }
    return l;
  }
  parseUnary() {
    if (this.peek().kind === "SYM" && this.peek().value === "-") {

      }

    if (t.kind === "STR_RAW")    { this.advance(); return N.Str(t.value, false); }
    if (t.kind === "STR_COOKED") { this.advance(); return N.Str(t.value, true); }
    if (t.kind === "KW" && t.value === "真") { this.advance(); return N.Bool(true); }
    if (t.kind === "KW" && t.value === "偽") { this.advance(); return N.Bool(false); }
    if (t.kind === "KW" && t.value === "無") { this.advance(); return N.None(); }

    if (t.kind === "KW" && t.value === "関数")   return this.parseLambda();

        const tt = this.peek();
        if (tt.kind === "EOF") throw new ParseError("カッコが閉じていません");
        if (tt.kind === "SYM" && tt.value === "(") depth++;

        inner.push(this.advance());

    }
    if (t.kind === "SYM" && t.value === "[") {
      this.advance();
      const items = [];
      this.skipNewlines();
      if (!this.check("SYM","]")) {
        items.push(this.parseExpr());
        this.skipNewlines();
        while (this.match("SYM",",")) {
          this.skipNewlines();
          items.push(this.parseExpr());
          this.skipNewlines();
        }
      }
      this.skipNewlines();
      this.expect("SYM","]");
      return N.List(items);
    }
    if (t.kind === "SYM" && t.value === "{") {
      this.advance();
      const pairs = [];
      this.skipNewlines();
      if (!this.check("SYM","}")) {
        while (true) {
          this.skipNewlines();
          const k = this.parseExpr();
          this.expect("SYM","→");
          const v = this.parseExpr();
          pairs.push([k, v]);
          this.skipNewlines();
          if (!this.match("SYM",",")) break;
          this.skipNewlines();
        }
      }
      this.skipNewlines();
      this.expect("SYM","}");
      return N.Dict(pairs);
    }
    if (t.kind === "IDENT") { this.advance(); return N.Ident(t.value); }
    throw new ParseError(`${t.line}行目：式の解釈に失敗（${t.kind}:${JSON.stringify(t.value)}）`);
  }
}

      this.consts.add(name);

        if (env.consts.has(name)) throw new RuntimeYuiError(`「${name}」は不変宣言（〜である）のため再代入できません`);

        const toks = tokenize(exprSrc).filter(t => t.kind !== "NEWLINE" && t.kind !== "EOF");

function loadStdlib(env) {
  // 数学定数を環境にバインド
  env.set("円周率", Math.PI, true);
  env.set("ネイピア数", Math.E, true);
  if (typeof STDLIB_SRC === "undefined" || !STDLIB_SRC) return;
  try {
    const tokens = tokenize(STDLIB_SRC);
    const prog = new Parser(tokens).parseProgram();
    Evaluator.eval(prog, env);
  } catch (e) {
    console.warn("stdlib読み込み失敗：", e.message);
  }
}

function formatError(msg, source) {
  const m = /^(\d+)行目/.exec(msg);
  if (!m) return msg;
  const lineNo = parseInt(m[1], 10);
  const lines = source.split("\n");
  if (lineNo < 1 || lineNo > lines.length) return msg;
  const pad = " ".repeat(String(lineNo).length + 2);
  return `${msg}\n${pad}${lineNo} | ${lines[lineNo-1]}`;
}

let _lastEnv = null;
function runYui(source) {
  _outputBuf = [];
  let env;
  try {
    env = new Environment();
    loadStdlib(env);
    const tokens = tokenize(source);
    const prog = new Parser(tokens).parseProgram();
    Evaluator.eval(prog, env);
    _lastEnv = env;
    return { ok: true, output: _outputBuf.join("\n"), env };
  } catch (e) {
    _lastEnv = env;
    const raw = (e instanceof LexError || e instanceof ParseError || e instanceof RuntimeYuiError)
      ? e.message
      : `${e.name}: ${e.message}`;
    return { ok: false, output: _outputBuf.join("\n"), error: formatError(raw, source), env };
  }
}

function dumpEnv(env) {
  if (!env || !env.vars) return "（環境なし）";
  const entries = [];
  for (const [k, v] of env.vars) {
    if (k.startsWith("__") || k === "__builtins__") continue;
    if (v instanceof YuiFunction) {
      entries.push(`${k} ＝ <関数：${v.params.map(p => `[${p[0]}]${p[1]}`).join(" ")}>`);
    } else if (v instanceof Race) {
      entries.push(`${k} ＝ <種族：${v.attrs.join(", ")}>`);
    } else {
      entries.push(`${k} ＝ ${yuiToStr(v)}`);
    }
  }
  return entries.length ? entries.join("\n") : "（変数なし）";
}

出力は1行のYuiコードのみ。日本語の説明や括弧書きは不要。`,
  sakura_code: `あなたは「さくら」。あなたの感情や行動を、結（Yui）言語の1行のコードとして表現してください。
構文例：
  葵 に 3 を 好感度加算
  「私は…」を 描写する
  さくら が 「……」と 思う
出力は1行のYuiコードのみ。`,
};

const MODES = {
  duo: { label: "2者対話", roles: ["aoi", "sakura"] },
  trio: { label: "3者対話", roles: ["aoi", "sakura", "narrator"] },
  reverse: { label: "逆転", roles: ["aoi_reverse", "sakura_reverse"] },
  bilingual: { label: "言語実験", roles: ["aoi_en", "sakura_jp"] },
  code: { label: "コードで話す", roles: ["aoi_code", "sakura_code"], evalYui: true },
};

let currentMode = "duo";
let engine = null;
let modelLoaded = false;
let running = false;
let stopRequested = false;
let turnCount = 0;
let yuiLineCount = 0;

const histories = {};   // role -> [{role, content}]
const summaries = {};   // role -> string
const state = {
  場面: "教室の朝",
  時刻: "朝",
  葵好感度: 30,
  さくら好感度: 30,
  最後の発言者: null,
};

/* ============================================================
 * Yui共有環境（コードで話すモード用）
 * ============================================================ */
let yuiEnv = null;
function initYuiEnv() {
  yuiEnv = new Environment();
  loadStdlib(yuiEnv);
  // drama.yui を埋め込みロード
  try {
    const tokens = tokenize(DRAMA_SRC);
    const prog = new Parser(tokens).parseProgram();
    Evaluator.eval(prog, yuiEnv);
    // キャラを生成
    const setupSrc = `
さくら を 新しい キャラ(名前 → 「さくら」, 一人称 → 「私」, 口調 → 「敬語」, 好感度 → ${state.さくら好感度}) とする
葵 を 新しい キャラ(名前 → 「葵」, 一人称 → 「俺」, 口調 → 「中性」, 好感度 → ${state.葵好感度}) とする
`;
    const t2 = tokenize(setupSrc);
    const p2 = new Parser(t2).parseProgram();
    Evaluator.eval(p2, yuiEnv);
  } catch (e) {
    console.warn("yuiEnv init失敗:", e);
  }
}
function syncYuiStateToWorld() {
  try {
    const aoi = yuiEnv.get("葵");
    const sakura = yuiEnv.get("さくら");
    if (aoi) state.葵好感度 = aoi["好感度"];
    if (sakura) state.さくら好感度 = sakura["好感度"];
  } catch (e) {}
}
function evalYuiLine(src) {
  try {
    const captured = [];
    const orig = BUILTINS["表示"];
    BUILTINS["表示"] = (a, env) => { let v = a["を"]; if (v === undefined) v = env.getTopic(); captured.push(yuiToStr(v)); return null; };
    const tokens = tokenize(src);
    const prog = new Parser(tokens).parseProgram();
    Evaluator.eval(prog, yuiEnv);
    BUILTINS["表示"] = orig;
    syncYuiStateToWorld();
    return { ok: true, output: captured.join("\n") };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

/* ============================================================
 * UI 要素
 * ============================================================ */
const $ = (id) => document.getElementById(id);
const log = $("log"); const yuiOut = $("yui-out");
const loaderEl = $("loader"); const progressBar = $("progress-bar"); const loaderMsg = $("loader-msg");
const startBtn = $("startBtn"); const stopBtn = $("stopBtn"); const resetBtn = $("resetBtn"); const interventBtn = $("interventBtn");
const statusIndicator = $("status-indicator"); const modeInd = $("mode-ind"); const yuiInd = $("yui-ind");

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* パラメータ更新 */
const params = { temp: 0.8, topp: 0.95, maxtok: 100, rep: 1.15, delay: 500, ctx: 6, comp: 3, scene: 8, autointer: 0.2 };
function bindParam(id, key, transform = (x)=>x, displayId = null) {
  const el = $(id); const dis = displayId ? $(displayId) : null;
  const update = () => {
    const raw = el.type === "number" ? parseFloat(el.value) : parseInt(el.value, 10);
    params[key] = transform(raw);
    if (dis) dis.textContent = typeof params[key] === "number" ? params[key].toFixed(2) : String(params[key]);
  };
  el.addEventListener("input", update); update();
}
bindParam("p-temp", "temp", x => x/10, "p-temp-v");
bindParam("p-topp", "topp", x => x/100, "p-topp-v");
bindParam("p-maxtok", "maxtok");
bindParam("p-rep", "rep", x => x/100, "p-rep-v");
bindParam("p-delay", "delay");
bindParam("p-ctx", "ctx");
bindParam("p-comp", "comp");
bindParam("p-scene", "scene");
bindParam("p-autointer", "autointer", x => x/100, "p-autointer-v");
$("p-autointer-v").textContent = "20%";

/* プロンプト編集 */
$("prompt-aoi").value = PROMPTS.aoi;
$("prompt-sakura").value = PROMPTS.sakura;
$("prompt-narrator").value = PROMPTS.narrator;
function getCustomPrompts() {
  return {
    aoi: $("prompt-aoi").value || PROMPTS.aoi,
    sakura: $("prompt-sakura").value || PROMPTS.sakura,
    narrator: $("prompt-narrator").value || PROMPTS.narrator,
  };
}

/* モード切替 */
document.querySelectorAll("#modes button").forEach(btn => {
  btn.addEventListener("click", () => {
    if (running) return;
    document.querySelectorAll("#modes button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    modeInd.textContent = MODES[currentMode].label;
    resetAll();
  });
});

/* 状態更新 */
function updateStateBar() {
  $("s-scene").textContent = state.場面;
  $("s-time").textContent = state.時刻;
  $("s-aoi").textContent = state.葵好感度;
  $("s-sakura").textContent = state.さくら好感度;
  $("s-turn").textContent = turnCount;
  const compCount = Object.values(summaries).filter(s => s).length;
  $("s-comp").textContent = compCount > 0 ? `${compCount}件` : "なし";
}

/* ログ */
function addLog(role, text, cls) {
  const div = document.createElement("div");
  div.className = "turn " + (cls || role);
  if (cls === "system" || cls === "compress") {
    div.textContent = (cls === "compress" ? "［文脈圧縮］" : "") + text;
  } else if (cls === "code") {
    div.innerHTML = highlightYui(text);
  } else if (cls === "translation") {
    div.textContent = text;
  } else {
    const roleLabel = ({aoi:"葵",aoi_reverse:"葵",aoi_en:"葵",aoi_code:"葵",sakura:"さくら",sakura_reverse:"さくら",sakura_jp:"さくら",sakura_code:"さくら",narrator:"ナレーター"})[role] || role;
    div.innerHTML = `<span class="role">${roleLabel}：</span>${escapeHtml(text)}`;
  }
  log.appendChild(div); log.scrollTop = log.scrollHeight;
}

/* Yuiコード表示 */
function highlightYui(line) {
  const KW = /^(もし|ならば|おわり|関数|戻り値|真|偽|無|とする|である|せよ|だろうか|新しい|種族|属性)/;
  const PT = /^(から|まで|より|を|に|で|へ|と|は|が|の)(?=[^ぁ-んァ-ヶー一-龥]|$)/;
  const cmIdx = line.indexOf("※");
  let head = cmIdx >= 0 ? line.slice(0, cmIdx) : line;
  let tail = cmIdx >= 0 ? line.slice(cmIdx) : "";
  let r = ""; let i = 0;
  while (i < head.length) {
    const c = head[i];
    if (c === "「" || c === "『") {
      const cl = c === "「" ? "」" : "』";
      let j = head.indexOf(cl, i+1); if (j === -1) j = head.length - 1;
      r += `<span class="tok-str">${escapeHtml(head.slice(i, j+1))}</span>`;
      i = j + 1; continue;
    }
    const sub = head.slice(i); let m;
    if ((m = sub.match(KW))) { r += `<span class="tok-kw">${escapeHtml(m[0])}</span>`; i += m[0].length; }
    else if ((m = sub.match(PT))) { r += `<span class="tok-particle">${escapeHtml(m[0])}</span>`; i += m[0].length; }
    else if ((m = sub.match(/^(\d[\d_.]*)/))) { r += `<span class="tok-num">${escapeHtml(m[0])}</span>`; i += m[0].length; }
    else { r += escapeHtml(c); i++; }
  }
  if (tail) r += `<span class="tok-comment">${escapeHtml(tail)}</span>`;
  return r;
}

function addYuiCode(role, text, fromCodeMode) {
  yuiLineCount++;
  yuiInd.textContent = `行 ${yuiLineCount}`;
  let yuiSrc;
  if (fromCodeMode) {
    yuiSrc = text;
  } else {
    const speaker = ({aoi:"葵",aoi_reverse:"葵",aoi_en:"葵",aoi_code:"葵",sakura:"さくら",sakura_reverse:"さくら",sakura_jp:"さくら",sakura_code:"さくら"})[role];
    if (role === "narrator") yuiSrc = `「${text}」を 描写する`;
    else if (speaker) yuiSrc = `${speaker} が 「${text}」と 言う`;
    else return;
  }
  const div = document.createElement("div"); div.className = "turn";
  const head = document.createElement("div"); head.className = "turn-head";
  head.textContent = `T${turnCount} / 葵=${state.葵好感度} / さくら=${state.さくら好感度}`;
  const body = document.createElement("div");
  body.innerHTML = yuiSrc.split("\n").map(l => highlightYui(l)).join("\n");
  div.appendChild(head); div.appendChild(body);
  yuiOut.appendChild(div); yuiOut.scrollTop = yuiOut.scrollHeight;
}

/* ============================================================
 * LLM 推論
 * ============================================================ */
function getSystemPrompt(role) {
  const customs = getCustomPrompts();
  const map = { aoi: customs.aoi, sakura: customs.sakura, narrator: customs.narrator,
    aoi_reverse: PROMPTS.aoi_reverse, sakura_reverse: PROMPTS.sakura_reverse,
    aoi_en: PROMPTS.aoi_en, sakura_jp: PROMPTS.sakura_jp,
    aoi_code: PROMPTS.aoi_code, sakura_code: PROMPTS.sakura_code };
  return map[role] || "";
}

function buildStateSnap() {
  return `【現在の状態】場面=${state.場面}、時刻=${state.時刻}、葵→さくら好感度=${state.葵好感度}、さくら→葵好感度=${state.さくら好感度}`;
}

async function inferOne(role, userText) {
  const sys = getSystemPrompt(role);
  const summary = summaries[role] || "";
  const history = histories[role] || [];
  const stateSnap = buildStateSnap();
  const messages = [
    { role: "system", content: sys + "\n\n" + stateSnap + (summary ? "\n【これまでの要約】" + summary : "") },
    ...history,
    { role: "user", content: userText },
  ];
  const reply = await engine.chat.completions.create({
    messages, temperature: params.temp, top_p: params.topp,
    max_tokens: params.maxtok, frequency_penalty: 0,
    repetition_penalty: params.rep,
  });
  let text = reply.choices[0].message.content.trim();
  text = text.replace(/^[「『](.+)[」』]$/s, "$1").trim();
  // 役割名のprefixを除去
  text = text.replace(/^(葵|さくら|ナレーター)[：:]\s*/, "").trim();
  return text || "……";
}

async function summarize(role) {
  const h = histories[role];
  if (!h || h.length < params.ctx * 2) return;
  const old = h.splice(0, h.length - params.ctx);
  const dialog = old.map(m => (m.role === "user" ? "相手" : "自分") + "：" + m.content).join("\n");
  const prev = summaries[role] || "";
  const prompt = (prev ? `これまでの要約：${prev}\n\n` : "") +
    `次の会話を、感情と関係性が伝わるよう1〜2文で要約してください：\n${dialog}\n\n要約：`;
  try {
    const r = await engine.chat.completions.create({
      messages: [{ role: "user", content: prompt }],
      temperature: 0.3, max_tokens: 80,
    });
    summaries[role] = r.choices[0].message.content.trim().replace(/^要約[：:]\s*/, "");
    return summaries[role];
  } catch (e) { console.warn("summarize失敗", e); }
}

/* ============================================================
 * 介入
 * ============================================================ */
const INTERVENTIONS = [
  { event: "雨が降りはじめた", scene: "雨の校舎" },
  { event: "ベルが鳴った", scene: "次の授業へ" },
  { event: "風が桜の花びらを散らした", scene: "桜散る" },
  { event: "教室に光が差し込んだ", scene: "夕方" },
  { event: "誰かの足音が遠ざかる", scene: "静寂" },
  { event: "校内放送が流れた", scene: "放送中" },
  { event: "蝉の声が響いた", scene: "夏" },
  { event: "雪がちらつきはじめた", scene: "冬" },
];
function injectIntervention(forced) {
  const it = INTERVENTIONS[Math.floor(Math.random() * INTERVENTIONS.length)];
  state.場面 = it.scene; state.時刻 = it.scene.includes("夕") ? "夕方" : state.時刻;
  addLog("narrator", `── ${it.event} ──`, "system");
  // 全エージェントに介入をフィードバック
  for (const role of MODES[currentMode].roles) {
    if (!histories[role]) histories[role] = [];
    histories[role].push({ role: "user", content: `［ナレーター］${it.event}` });
  }
  updateStateBar();
}

/* ============================================================
 * 状態推定
 * ============================================================ */
function estimateAffinityChange(speaker, text) {
  const positive = /好き|ありがとう|嬉しい|一緒|大切|綺麗|可愛い|はい|ええ/;
  const negative = /嫌い|消えろ|帰れ|無理|嫌だ|気持ち悪/;
  if (negative.test(text)) return -8;
  if (positive.test(text)) return +5;
  if (text.length > 30) return +1;
  return 0;
}

/* ============================================================
 * メインループ
 * ============================================================ */
async function autoLoop() {
  const mode = MODES[currentMode];
  const roles = mode.roles;
  let idx = 0;
  // 初期入力（1人目への発話プロンプト）
  let lastUtterance = "（沈黙が流れる）";
  if (currentMode === "code") {
    initYuiEnv();
    lastUtterance = "（場面が始まる。最初のYui1行を書いて。）";
  } else {
    lastUtterance = "（場面が始まった。最初に発言してください。）";
  }

  while (!stopRequested) {
    const role = roles[idx % roles.length];
    const isNarrator = role === "narrator";
    statusIndicator.textContent = `${role} 推論中…`;
    let text;
    try {
      // 言語実験モード：アシスタント用に翻訳を仲介
      if (currentMode === "bilingual" && idx > 0) {
        // 前の発言を翻訳して渡す
        const prevRole = roles[(idx - 1) % roles.length];
        if (prevRole === "aoi_en" && role === "sakura_jp") {
          // EN -> JP
          const tr = await engine.chat.completions.create({
            messages: [{ role: "system", content: PROMPTS.translator_to_jp }, { role: "user", content: lastUtterance }],
            temperature: 0.3, max_tokens: 80,
          });
          const jpText = tr.choices[0].message.content.trim();
          addLog("translation", `（訳）${jpText}`, "translation");
          lastUtterance = jpText;
        } else if (prevRole === "sakura_jp" && role === "aoi_en") {
          // JP -> EN
          const tr = await engine.chat.completions.create({
            messages: [{ role: "system", content: PROMPTS.translator_to_en }, { role: "user", content: lastUtterance }],
            temperature: 0.3, max_tokens: 80,
          });
          const enText = tr.choices[0].message.content.trim();
          addLog("translation", `(EN) ${enText}`, "translation");
          lastUtterance = enText;
        }
      }
      text = await inferOne(role, lastUtterance);
    } catch (e) {
      addLog("system", "推論失敗：" + e.message, "system");
      break;
    }
    if (stopRequested) break;

    if (currentMode === "code") {
      addLog(role, text, "code");
      const r = evalYuiLine(text);
      if (!r.ok) addLog("system", `Yuiエラー：${r.error}`, "system");
      else if (r.output) addLog("narrator", `（実行：${r.output}）`, "system");
    } else {
      addLog(role, text);
    }
    addYuiCode(role, text, currentMode === "code");
    turnCount++;

    // 状態更新（コードモード以外）
    if (currentMode !== "code") {
      if (role === "aoi" || role === "aoi_reverse" || role === "aoi_en" || role === "aoi_code") {
        state.葵好感度 += estimateAffinityChange(role, text);
      } else if (role === "sakura" || role === "sakura_reverse" || role === "sakura_jp" || role === "sakura_code") {
        state.さくら好感度 += estimateAffinityChange(role, text);
      }
    }

    // 履歴に追加
    for (const r2 of roles) {
      if (!histories[r2]) histories[r2] = [];
      const hRole = (r2 === role) ? "assistant" : "user";
      histories[r2].push({ role: hRole, content: text });
    }
    lastUtterance = text;

    // 場面遷移
    if (turnCount > 0 && turnCount % params.scene === 0) {
      injectIntervention(true);
    } else if (params.autointer > 0 && Math.random() < params.autointer / params.scene) {
      injectIntervention(false);
    }

    // 圧縮
    if (turnCount > 0 && turnCount % params.comp === 0) {
      statusIndicator.textContent = "コンテキスト圧縮中…";
      for (const r2 of roles) {
        const before = (histories[r2] || []).length;
        if (before > params.ctx * 2) {
          const sum = await summarize(r2);
          if (sum) addLog("compress", `[${r2}] ${sum}`, "compress");
        }
      }
    }

    updateStateBar();
    idx++;
    await sleep(params.delay);
  }
  statusIndicator.textContent = "停止";
  running = false; stopRequested = false;
  startBtn.disabled = false; stopBtn.disabled = true;
  interventBtn.disabled = true;
}

/* ============================================================
 * 初期化・操作
 * ============================================================ */
async function initWebLLM() {
  const sel = document.getElementById("model-select");
  if (sel) MODEL_ID = sel.value || MODEL_ID;
  const pw = document.getElementById("progress-wrap");
  const lm = document.getElementById("loader-msg");
  const ls = document.getElementById("loader-start");
  if (pw) pw.style.display = "block";
  if (lm) lm.style.display = "block";
  if (ls) ls.disabled = true;
  if (sel) sel.disabled = true;
  try {
    engine = await CreateMLCEngine(MODEL_ID, {
      initProgressCallback: (report) => {
        loaderMsg.textContent = report.text || "ロード中…";
        if (typeof report.progress === "number") progressBar.style.width = `${Math.round(report.progress * 100)}%`;
      },
    });
    modelLoaded = true; loaderEl.style.display = "none";
    statusIndicator.textContent = "待機中"; startBtn.disabled = false;
    addLog("system", `${MODEL_ID.split("-MLC")[0]} ロード完了。モードを選んで開始してください。`, "system");
  } catch (e) {
    loaderMsg.textContent = "エラー：" + e.message;
    progressBar.style.background = "#e07a5f";
    if (ls) ls.disabled = false;
    if (sel) sel.disabled = false;
  }
}

function resetAll() {
  for (const k of Object.keys(histories)) delete histories[k];
  for (const k of Object.keys(summaries)) delete summaries[k];
  state.場面 = "教室の朝"; state.時刻 = "朝";
  state.葵好感度 = 30; state.さくら好感度 = 30;
  turnCount = 0; yuiLineCount = 0; yuiInd.textContent = "行 0";
  log.innerHTML = ""; yuiOut.innerHTML = "";
  addLog("system", `モード「${MODES[currentMode].label}」にリセット。`, "system");
  updateStateBar();
}

startBtn.addEventListener("click", () => {
  if (running || !modelLoaded) return;
  running = true; stopRequested = false;
  startBtn.disabled = true; stopBtn.disabled = false; interventBtn.disabled = false;
  autoLoop();
});
stopBtn.addEventListener("click", () => {
  stopRequested = true;
  if (engine && engine.interruptGenerate) engine.interruptGenerate();
});
resetBtn.addEventListener("click", () => {
  if (running) return;
  resetAll();
});
interventBtn.addEventListener("click", () => { injectIntervention(true); });
$("loader-skip").addEventListener("click", () => {
  loaderEl.style.display = "none";
  modelLoaded = true; startBtn.disabled = false;
  statusIndicator.textContent = "オフライン（デモ）";
  engine = {
    chat: { completions: { create: async ({messages}) => {
      const last = messages[messages.length-1].content || "";
      const sys = messages[0]?.content || "";
      let dummy;
      if (sys.includes("ナレーター")) dummy = "風が窓を叩く音だけが、二人のあいだを通り抜けた。";
      else if (sys.includes("English")) dummy = "...I think I'm starting to understand.";
      else if (sys.includes("Yui")) dummy = `葵 が 「……」と 思う`;
      else dummy = "……お前の言うこと、少しわかった気がする。";
      return { choices: [{ message: { content: dummy }}]};
    }}},
    interruptGenerate: () => {},
  };
  addLog("system", "オフラインモード。LLMの代わりにダミー応答が出ます。", "system");
});

updateStateBar();
const _ls = document.getElementById("loader-start");
if (_ls) _ls.addEventListener("click", () => initWebLLM());
</script>
